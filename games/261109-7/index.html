<body>

<script>
(function () {
'use strict';
var PI = Math.PI, TAU = PI * 2;
var cv = document.getElementById('c');
var mainCtx = cv.getContext('2d');
var ctx = mainCtx;
var saEl = document.getElementById('sa');

/* ---------- palette: 生成り台紙 + 朱赤・紺・山吹・青緑 ---------- */
var RED = '#d3412c', NAVY = '#24315e', YEL = '#eda52a', TEAL = '#1e8a81';
var CREAM = '#efe3c8', PAPER = '#f8f0de', WHITE = '#fffcf2';
var SH = 'rgba(32,24,44,0.30)', SHADE = 'rgba(36,49,94,0.56)', SHADE2 = 'rgba(36,49,94,0.30)';

var DOORS = [0.20, 0.60, 0.80], CAKEF = 0.945;
var ITEM_OF = { candy: 'candy', bakery: 'bread', flower: 'flower' };
var TUBE_OF = { candy: 'wide', cake: 'wide', bread: 'tilt', flower: 'thin' };
var TUBE_COL = { wide: RED, thin: TEAL, tilt: YEL };
var ITEMS = ['candy', 'bread', 'flower', 'cake'];
var SLOT_LX = [0.36, 0.62, 0.88];
var MAXP = 90, MAXSIGN = 4;

/* ---------- helpers ---------- */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var JIT = []; (function () { var r = rng(7); for (var i = 0; i < 128; i++) JIT.push(r() * 2 - 1); })();
var R = Math.random;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function ease(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }

function approach(v, t, k, dt) { return v + (t - v) * Math.min(1, k * dt); }
function validItem(s) { return ITEMS.indexOf(s) >= 0; }

/* ---------- paper primitives ---------- */
var LIFT = 3;
function P(p) { var q = new Path2D(); q.moveTo(p[0], p[1]); for (var i = 2; i < p.length; i += 2) q.lineTo(p[i], p[i + 1]); q.closePath(); return q; }
function ell(cx, cy, rx, ry, n, j, seed, rot) {
  var p = [], c = rot ? Math.cos(rot) : 1, s = rot ? Math.sin(rot) : 0;
  for (var i = 0; i < n; i++) {
    var a = i / n * TAU, k = 1 + j * JIT[(i + seed) & 127];
    var x = Math.cos(a) * rx * k, y = Math.sin(a) * ry * k;

}
function rect(x, y, w, h, j, seed) {
  var m = Math.min(w, h) * (j || 0); seed = seed || 0;
  return [x + JIT[seed & 127] * m, y + JIT[(seed + 1) & 127] * m, x + w + JIT[(seed + 2) & 127] * m, y + JIT[(seed + 3) & 127] * m,
    x + w + JIT[(seed + 4) & 127] * m, y + h + JIT[(seed + 5) & 127] * m, x + JIT[(seed + 6) & 127] * m, y + h + JIT[(seed + 7) & 127] * m];
}
function paperPath(p, col, lift) {
  if (lift > 0) {
    ctx.save(); ctx.translate(lift * 0.8, lift * 1.15); ctx.fillStyle = SH; ctx.fill(p); ctx.restore();
    ctx.save(); ctx.translate(lift * 0.22, lift * 0.3); ctx.fillStyle = WHITE; ctx.fill(p); ctx.restore();

}
function paper(pts, col, lift) { paperPath(P(pts), col, lift || 0); }
function fillPts(pts, col) { ctx.fillStyle = col; ctx.fill(P(pts)); }

/* ---------- audio (Web Audio synth) ---------- */
var AC = null, MG = null, NB = null;

}

  } catch (e) {}
}
var SND = {
  press: function () { nz(0.04, 0.22, 2600, 2); },
  click: function (p) { tone(1150 + p * 160, 0.05, 'square', 0.07); nz(0.03, 0.3, 3200, 3); },
  roll: function (slot) { for (var k = 0; k < 9; k++) tone(520 + slot * 110 + k * 22, 0.03, 'triangle', 0.06, 0.12 + k * 0.075); },
  gear: function (slot) { var f = 330 + slot * 70; tone(f, 0.12, 'triangle', 0.17); tone(f * 1.5, 0.1, 'triangle', 0.11, 0.09); },
  brim: function (type, w, t) {
    if (type === 'wide') { nz(0.25, 0.22, 600, 1.5, 0, 'bandpass', 2600); tone(380 + w * 90, 0.2, 'sine', 0.14, 0.02, (380 + w * 90) * 1.6); }
    else if (type === 'thin') { nz(0.25, 0.22, 2600, 1.5, 0, 'bandpass', 600); tone(900 - w * 80, 0.2, 'sine', 0.14, 0.02, (900 - w * 80) * 0.6); }
    else { tone(520 + t * 60, 0.22, 'triangle', 0.13, 0, 720 + t * 60); nz(0.15, 0.12, 1500, 2); }
    tone(200 + w * 20, 0.35, 'sine', 0.06, 0.18, 170);
  },
  chime: function () { tone(1046, 0.25, 'sine', 0.11); tone(1318, 0.3, 'sine', 0.09, 0.08); },
  success: function () { [523, 659, 784, 1046].forEach(function (f, i) { tone(f, 0.32, 'triangle', 0.15, i * 0.08); }); nz(0.4, 0.07, 5000, 1, 0.3, 'highpass'); },
  big: function () { [392, 523, 659, 784, 1046, 1318].forEach(function (f, i) { tone(f, 0.45, 'triangle', 0.14, i * 0.07); }); tone(262, 0.8, 'sine', 0.12, 0.1); nz(0.6, 0.08, 6000, 1, 0.35, 'highpass'); },
  sign: function () { nz(0.12, 0.35, 800, 1); tone(196, 0.16, 'sine', 0.2); tone(392, 0.14, 'triangle', 0.12, 0.1); },
  buy: function () { tone(1568, 0.35, 'sine', 0.09); tone(2093, 0.3, 'sine', 0.07, 0.06); },
  pop: function () { tone(700 + R() * 300, 0.07, 'sine', 0.12, 0, 1300); },
  drip: function () { tone(520, 0.16, 'sine', 0.07, 0, 260); },
  deny: function () { tone(190, 0.15, 'square', 0.045, 0, 150); },
  tap: function () { tone(660 + R() * 220, 0.05, 'sine', 0.05); },
  whoosh: function (d) { nz(d, 0.16, 300, 0.8, 0, 'bandpass', 1900); },
  shutter: function () { nz(0.05, 0.4, 4000, 2); nz(0.05, 0.4, 3000, 2, 0.09); tone(1760, 0.12, 'sine', 0.08, 0.16); },
  hat: function () { nz(0.2, 0.2, 1500, 1, 0, 'bandpass', 4200); tone(600, 0.16, 'sine', 0.1, 0, 1250); },
  plop: function () { tone(320, 0.1, 'sine', 0.15, 0, 200); nz(0.06, 0.15, 900, 1); },
  flip: function () { nz(0.1, 0.2, 1200, 1.5, 0, 'bandpass', 2400); tone(440, 0.08, 'triangle', 0.08); },
  wall: function () { for (var i = 0; i < 6; i++) nz(0.1, 0.18, 700 + i * 150, 1.2, i * 0.12); }

/* ---------- layout ---------- */
var L = {}, dpr = 1, bgC = null, wallLC = null, wallRC = null, needLayout = true;
function X(f) { return L.wx + f * L.ww; }
function MX(lx) { return L.mflip ? L.mx + (1 - lx) * L.mw : L.mx + lx * L.mw; }
function MY(ly) { return L.my + ly * L.mh; }
function slotLX(i) { return L.mflip ? SLOT_LX[2 - i] : SLOT_LX[i]; }
function readSafe() {
  var cs = getComputedStyle(saEl);
  return { t: parseFloat(cs.paddingTop) || 0, r: parseFloat(cs.paddingRight) || 0, b: parseFloat(cs.paddingBottom) || 0, l: parseFloat(cs.paddingLeft) || 0 };
}
function layout() {
  var W = Math.max(200, window.innerWidth), H = Math.max(200, window.innerHeight);

  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  var sa = readSafe();
  L.W = W; L.H = H; L.sa = sa;
  L.port = W / H < 1.0;
  if (L.port) {
    L.wx = sa.l + W * 0.04; L.ww = W - sa.l - sa.r - W * 0.08; L.wy = sa.t + H * 0.02; L.wb = H * 0.52;
    L.mx = W * 0.385; L.mw = W - sa.r - W * 0.02 - L.mx; L.my = L.wb + H * 0.02; L.mh = H - sa.b - H * 0.015 - L.my; L.mflip = false;
  } else {

    L.wx = L.mx + L.mw + W * 0.03; L.ww = W - sa.r - W * 0.025 - L.wx; L.wy = sa.t + H * 0.04; L.wb = H * 0.53;
  }
  L.wh = L.wb - L.wy; L.gh = L.wh * 0.2; L.streetY = L.wb - L.gh;
  L.g = Math.min(L.ww * 0.085, H * 0.05, (H - sa.b - H * 0.025 - L.wb) / 7.9);

  L.shopW = L.ww * 0.18; L.shopH = Math.min(L.wh * 0.48, L.shopW * 1.7);
  L.split = L.wx + L.ww / 2;
  L.cu = Math.min(L.g * 0.95, L.shopH * 0.27);
  L.Ll = Math.min(0.27 * L.mh, 0.55 * L.mw);
  L.kr = clamp(Math.min(0.11 * L.mw, 0.065 * L.mh), 22, 46);
  L.gr = Math.min(0.085 * L.mw, 0.06 * L.mh);

/* ---------- item pictograms ---------- */
function drawItem(t, x, y, s, lift) {
  lift = lift || 0;
  if (t === 'candy') {
    paper(rect(x - s * 0.06, y, s * 0.12, s * 0.5, 0.05, 3), WHITE, lift);
    circ(x, y - s * 0.12, s * 0.3, RED, lift, 5);
    circ(x - s * 0.05, y - s * 0.16, s * 0.13, WHITE, 0, 9);
    circ(x - s * 0.02, y - s * 0.14, s * 0.06, RED, 0, 2);
  } else if (t === 'bread') {
    paper(ell(x, y, s * 0.42, s * 0.24, 16, 0.05, 4), YEL, lift);
    for (var i = -1; i <= 1; i++) fillPts([x + i * s * 0.17 - s * 0.04, y - s * 0.16, x + i * s * 0.17 + s * 0.02, y - s * 0.16, x + i * s * 0.17 + s * 0.08, y + s * 0.1, x + i * s * 0.17 + s * 0.02, y + s * 0.1], WHITE);
  } else if (t === 'flower') {
    paper(rect(x - s * 0.04, y - s * 0.05, s * 0.08, s * 0.5, 0.05, 8), TEAL, lift);
    paper([x, y + s * 0.2, x + s * 0.28, y + s * 0.05, x + s * 0.1, y + s * 0.3], TEAL, 0);
    for (var k = 0; k < 5; k++) { var a = k / 5 * TAU - PI / 2; circ(x + Math.cos(a) * s * 0.16, y - s * 0.16 + Math.sin(a) * s * 0.16, s * 0.12, RED, k === 0 ? lift : 0, k * 3); }
    circ(x, y - s * 0.16, s * 0.09, YEL, 0, 1);
  } else if (t === 'cake') {
    paper([x - s * 0.38, y + s * 0.25, x + s * 0.38, y + s * 0.25, x + s * 0.3, y - s * 0.12, x - s * 0.3, y - s * 0.12], YEL, lift);
    paper([x - s * 0.33, y - s * 0.02, x + s * 0.33, y - s * 0.02, x + s * 0.3, y - s * 0.15, x - s * 0.3, y - s * 0.15], WHITE, 0);
    circ(x, y - s * 0.26, s * 0.12, RED, 0, 6);

function brimIcon(type, x, y, s) {
  var rot = type === 'tilt' ? 0.38 : 0, a = type === 'wide' ? s * 0.5 : type === 'thin' ? s * 0.22 : s * 0.36;
  fillPts(ell(x, y + s * 0.1, a, s * 0.12, 14, 0, 0, rot), NAVY);
  ctx.save(); ctx.translate(x, y + s * 0.1); ctx.rotate(rot);
  fillPts([-s * 0.16, 0, s * 0.16, 0, s * 0.12, -s * 0.3, -s * 0.12, -s * 0.3], NAVY);
  ctx.restore();
}

/* ---------- static background cache ---------- */
function mkCanvas(w, h) {
  var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * dpr)); c.height = Math.max(1, Math.round(h * dpr));

function cloud(x, y, s, seed) {
  paper(ell(x, y, s, s * 0.42, 18, 0.06, seed), WHITE, LIFT * 0.8);
  paper(ell(x - s * 0.45, y + s * 0.05, s * 0.5, s * 0.32, 14, 0.06, seed + 3), WHITE, 0);

function shopColors(type) {

}
function drawShopStatic(i) {
  var type = S.shops[i].type, c = shopColors(type), cx = X(DOORS[i]), sw = L.shopW, sh = L.shopH, top = L.streetY - sh;

      cx + sw * 0.25, top + sh * 0.02, cx + sw * 0.25, top + sh * 0.12, cx + sw * 0.56, top + sh * 0.12, cx + sw * 0.56, top + sh * 0.25], c.roof, LIFT);

  if (S.flash > 0) { ctx.globalAlpha = S.flash; ctx.fillStyle = WHITE; ctx.fillRect(0, 0, L.W, L.H); ctx.globalAlpha = 1; }
}

/* ---------- loop ---------- */
var last = 0, raf = 0, running = false;
function frame(now) {
  raf = 0;
  if (!running) return;
  if (needLayout) layout();
  var dt = last ? (now - last) / 1000 : 1 / 60; last = now;
  dt = clamp(dt, 0, 0.05);
  update(dt);
  render();
  raf = requestAnimationFrame(frame);
}
function start() { if (running) return; running = true; last = 0; raf = requestAnimationFrame(frame); }
function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { stop(); if (AC && AC.state === 'running') { try { AC.suspend(); } catch (e) {} } if (S.saveT > 0) { S.saveT = -1; save(); } }
  else { if (AC) { try { AC.resume(); } catch (e) {} } if (S.ptr) S.ptr = null; S.lever.press = false; S.hat.drag = false; start(); }
});
window.addEventListener('pagehide', function () { if (S.saveT > 0) save(); });

newState();
loadSave();
if (S.signs.length >= 2) { S.wall.target = 1; S.wall.open = 1; }
else for (var si = 0; si < S.signs.length; si++) S.signs[si].f = clamp(S.signs[si].f, S.signs[si].len * 0.3, 1 - S.signs[si].len * 0.3);
if (S.bought.length) { var lb = S.bought[S.bought.length - 1]; S.tickets[slotOfType(TUBE_OF[lb])] = { item: lb, a: 0, consume: 0 }; }
layout();
start();

/* ---------- read-only hooks for automated checks ---------- */
window.__gf = {
  snap: function () {
    var k = knobPos(), se = shadowSE(S.hat.wA, S.hat.tA);
    return { leverPos: S.lever.pos, leverA: +S.lever.a.toFixed(3), leverSq: +S.lever.sq.toFixed(3), press: S.lever.press, marbles: S.marbles.length, pulses: S.pulses.length,
      brimW: S.hat.w, brimWA: +S.hat.wA.toFixed(3), tilt: S.hat.t, tiltA: +S.hat.tA.toFixed(3), hatOn: S.hat.on, shadow: [+se[0].toFixed(3), +se[1].toFixed(3)],
      tubes: S.tubes.slice(), shops: S.shops.map(function (s) { return { type: s.type, awning: s.awnT }; }), cake: { deco: S.cake.deco, complete: S.cake.complete, lid: +S.cake.lid.toFixed(2) },
      mill: S.mill.on, signs: S.signs.map(function (s) { return { f: +s.f.toFixed(3), len: +s.len.toFixed(3), dir: s.dir, kind: s.kind, risen: s.risen }; }),
      cust: S.cust.length, bags: S.cust.map(function (c) { return c.bag.slice(); }), bought: S.bought.slice(), wall: +S.wall.open.toFixed(2), cam: S.cam.avail, camTaken: S.cam.taken, photos: S.photos.length,
      invite: S.invite, demo: S.demo ? S.demo.type : null, parts: S.parts.length, tickets: S.tickets.map(function (t) { return t ? t.item : null; }), store: storeState, storeOK: storeOK, t: +S.t.toFixed(2) };
  },
  pts: function () {
    var k = knobPos(), hg = hatGeom(), mr = mRect(), cp = camPos();
    return { lever: { x: k.x, y: k.y }, hat: { x: hg.cx, y: hg.cy - L.g * 0.4 }, machine: mr, camera: cp, mill: { x: L.millX, y: L.millY },
      signs: S.signs.map(function (s) { var g = signGeom(s); return { x: g.cx, y: g.top + g.bh / 2, half: g.half }; }), X: [X(0), X(1)], streetY: L.streetY, girl: { x: L.gx, y: L.headY + L.g * 2 } };
  },
  log: function () { return S.log.slice(); },
  wind: function () { S.wind.next = 0.01; }
};
})();
</script>
