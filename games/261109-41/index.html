  s.lineTo(x0 + iw, y0 + id - cr); s.quadraticCurveTo(x0 + iw, y0 + id, x0 + iw - cr, y0 + id);
  s.lineTo(x0 + cr, y0 + id); s.quadraticCurveTo(x0, y0 + id, x0, y0 + id - cr);

/* ---------- static mesh merging (fewer draw calls) ---------- */
var _mgInv = new T.Matrix4(), _mgRel = new T.Matrix4();
function mergeUnder(node) {
  node.updateMatrixWorld(true);
  _mgInv.copy(node.matrixWorld).invert();
  var buckets = {}, order = [];
  (function walk(o) {
    for (var i = 0; i < o.children.length; i++) {
      var c = o.children[i];
      if (c.userData.anim || c.userData.keep) continue;
      if (c.isMesh) {
        var m = c.material;
        if (Array.isArray(m) || m.transparent || c.renderOrder || !c.visible || c.isSprite) continue;
        if (!buckets[m.uuid]) { buckets[m.uuid] = { mat: m, list: [] }; order.push(m.uuid); }
        buckets[m.uuid].list.push(c);
      }
      if (c.children.length) walk(c);
    }
  })(node);
  order.forEach(function (k) {
    var b = buckets[k]; if (b.list.length < 2) return;
    var pos = [], nor = [], uv = [];
    b.list.forEach(function (msh) {
      _mgRel.multiplyMatrices(_mgInv, msh.matrixWorld);
      var g = msh.geometry.index ? msh.geometry.toNonIndexed() : msh.geometry.clone();
      g.applyMatrix4(_mgRel);
      var P = g.attributes.position, N = g.attributes.normal, U = g.attributes.uv;
      for (var i = 0; i < P.count; i++) {
        pos.push(P.getX(i), P.getY(i), P.getZ(i));
        if (N) nor.push(N.getX(i), N.getY(i), N.getZ(i)); else nor.push(0, 1, 0);
        if (U) uv.push(U.getX(i), U.getY(i)); else uv.push(0, 0);
      }
      g.dispose();
      msh.parent.remove(msh);
    });
    var mg = new T.BufferGeometry();
    mg.setAttribute('position', new T.Float32BufferAttribute(pos, 3));
    mg.setAttribute('normal', new T.Float32BufferAttribute(nor, 3));
    mg.setAttribute('uv', new T.Float32BufferAttribute(uv, 2));
    mg.computeBoundingSphere();
    node.add(new T.Mesh(mg, b.mat));
  });
}
