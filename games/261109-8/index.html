(function(){

/* ================= 素材テクスチャ ================= */
var TXC={};
function buildTextures(){
  var c,g,i,x,y;
  // 藍の帆布の織り目
  c=mk(96,96);g=c.getContext('2d');g.fillStyle='#253a63';g.fillRect(0,0,96,96);
  for(y=0;y<96;y+=6)for(x=0;x<96;x+=6){
    var over=((x/6+y/6)&1);
    g.fillStyle=over?'rgba(92,122,178,0.32)':'rgba(8,16,38,0.30)';
    if(over)g.fillRect(x,y+1,6,4);else g.fillRect(x+1,y,4,6);
  }
  for(i=0;i<700;i++){g.fillStyle=srnd()<0.5?'rgba(150,170,210,0.10)':'rgba(5,10,25,0.14)';g.fillRect(srnd()*96|0,srnd()*96|0,1+(srnd()*2|0),1);}
  TXC.weave=c;
  // 木目
  c=mk(256,256);g=c.getContext('2d');
  for(y=0;y<256;y+=32){
    var b=110+srnd()*30|0;g.fillStyle='rgb('+(b+28)+','+(b-6)+','+(b-48)+')';g.fillRect(0,y,256,32);
    for(i=0;i<9;i++){
      g.strokeStyle='rgba(60,38,18,'+(0.12+srnd()*0.18).toFixed(2)+')';g.lineWidth=0.8+srnd()*1.4;g.beginPath();
      var yy=y+3+srnd()*26,ph=srnd()*6,am=0.6+srnd()*2.2;
      for(x=0;x<=256;x+=8){g.lineTo(x,yy+Math.sin(x*0.03+ph)*am);}g.stroke();
    }
    if(srnd()<0.7){var kx=srnd()*230+10,ky=y+8+srnd()*16;g.fillStyle='rgba(70,44,22,0.45)';g.beginPath();g.ellipse(kx,ky,5,3,0,0,TAU);g.fill();}
    g.fillStyle='rgba(35,22,10,0.55)';g.fillRect(0,y+30,256,2);
    var sx0=srnd()*200;g.fillRect(sx0,y,2,32);
  }
  for(i=0;i<900;i++){g.fillStyle=srnd()<0.5?'rgba(255,230,190,0.05)':'rgba(30,18,6,0.07)';g.fillRect(srnd()*256|0,srnd()*256|0,2,1);}
  TXC.wood=c;
  // 濡れた灰色の石
  c=mk(256,256);g=c.getContext('2d');g.fillStyle='#5a6064';g.fillRect(0,0,256,256);
  for(i=0;i<420;i++){var r=4+srnd()*22;g.fillStyle=srnd()<0.5?'rgba(140,150,155,0.07)':'rgba(25,30,34,0.09)';g.beginPath();g.ellipse(srnd()*256,srnd()*256,r,r*0.6,srnd()*3,0,TAU);g.fill();}
  for(y=0;y<256;y+=64){var off=((y/64)&1)?64:0;g.fillStyle='rgba(28,32,36,0.42)';g.fillRect(0,y,256,2);
    for(x=off;x<256+128;x+=128){g.fillRect(x%256,y,2,64);}}
  for(i=0;i<1600;i++){g.fillStyle=srnd()<0.5?'rgba(200,210,215,0.06)':'rgba(10,12,14,0.10)';g.fillRect(srnd()*256|0,srnd()*256|0,1,1);}
  for(i=0;i<16;i++){g.fillStyle='rgba(170,185,195,0.07)';g.beginPath();g.ellipse(srnd()*256,srnd()*256,10+srnd()*30,4+srnd()*8,0,0,TAU);g.fill();}
  TXC.stone=c;
  // 錆びた波板
  c=mk(64,64);g=c.getContext('2d');g.fillStyle='#7d3b24';g.fillRect(0,0,64,64);
  for(x=0;x<64;x+=8){g.fillStyle='rgba(30,10,5,0.35)';g.fillRect(x,0,3,64);g.fillStyle='rgba(200,110,70,0.18)';g.fillRect(x+4,0,2,64);}
  for(i=0;i<160;i++){g.fillStyle=srnd()<0.5?'rgba(150,80,40,0.25)':'rgba(40,20,10,0.25)';g.fillRect(srnd()*64|0,srnd()*64|0,2,2);}
  TXC.rust=c;
}
var PAT={};
function makePats(g){return{weave:g.createPattern(TXC.weave,'repeat'),wood:g.createPattern(TXC.wood,'repeat'),stone:g.createPattern(TXC.stone,'repeat'),rust:g.createPattern(TXC.rust,'repeat')};}

/* ================= 画面 ================= */
var W=1,H=1,DPR=1,S=1,SX=1,SY=1,OS=1,KX=1,KY=1,OX=0,OY=0,SAf={t:0,r:0,b:0,l:0};
var VX0=0,VX1=1000,VY0=0,VY1=1000;
var bg=null;
function readSA(){try{var cs=getComputedStyle(saEl);SAf.t=parseFloat(cs.paddingTop)||0;SAf.r=parseFloat(cs.paddingRight)||0;SAf.b=parseFloat(cs.paddingBottom)||0;SAf.l=parseFloat(cs.paddingLeft)||0;}catch(e){}}
function resize(){
  W=Math.max(1,window.innerWidth|0);H=Math.max(1,window.innerHeight|0);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cv.style.width=W+'px';cv.style.height=H+'px';
  readSA();
  var aw=W-SAf.l-SAf.r,ah=H-SAf.t-SAf.b;
  SX=Math.min(aw/900,ah/1000);
  SY=Math.max(SX,Math.min(SX*1.45,ah/1080));
  OS=Math.sqrt(SX*SY);S=SX;KX=OS/SX;KY=OS/SY;
  OX=SAf.l+aw/2-500*SX;OY=SAf.t+(ah-1000*SY)*(SY>SX*1.05?0.72:0.5);
  VX0=-OX/SX;VX1=(W-OX)/SX;VY0=-OY/SY;VY1=(H-OY)/SY;
  PAT=makePats(cx);
  buildBG();
}

function sd(ax,ay,bx,by){return hyp((ax-bx)*SX,(ay-by)*SY);}

/* ================= 世界の配置 ================= */

  return[[A.x-px*h,A.y-py*h],[A.x+px*h,A.y+py*h],[tx+px*h,ty+py*h],[tx-px*h,ty-py*h]];}

  BRWL:{k:'bridge',wide:true,conn:'far',ring:[382,334],q:[[382,600],[618,600],[618,334],[382,334]],ru:0,rv:1},
  BRWR:{k:'bridge',wide:true,conn:'far',ring:[618,334],q:[[382,600],[618,600],[618,334],[382,334]],ru:1,rv:1},

  CRA:{k:'cradle',ring:[500,934],q:[[420,600],[580,600],[622,934],[378,934]],ru:.5,rv:1},

  SIDE:{k:'side',narrow:true,conn:'side',ring:[92,522],q:strip(92,522,52),ru:.5,rv:1}
};

FORM_KEYS.forEach(function(k){FORMS[k].qo=P2(FORMS[k].q);FORMS[k].key=k;});

/* ================= 状態 ================= */
var G={
  form:'REST',formVer:0,
  C:[],T:[],ru:.5,rv:1,rut:.5,rvt:1,spring:'settle',
  fold:1,press:0,ten:0,boing:0,boingP:null,

var crates=[],workers=[],parts=[],ripples=[];

function logEv(name){G.ev.push({t:+G.t.toFixed(2),e:name});if(G.ev.length>300)G.ev.shift();}
function disc(name,big){if(G.disc[name])return false;G.disc[name]=true;logEv('disc:'+name);if(big)AU.big();else AU.success();G.saveT=0.6;return true;}

function initCanvasShape(){
  var q=FORMS.REST.qo;G.C=[];G.T=[];
  for(var i=0;i<4;i++){G.C.push({x:q[i].x,y:q[i].y,vx:0,vy:0});G.T.push({x:q[i].x,y:q[i].y});}
  G.Tq=q.map(function(p){return{x:p.x,y:p.y};});
}
function bil(q,u,v){var a=q[0],b=q[1],c=q[2],d=q[3];
  var x0=a.x+(b.x-a.x)*u,y0=a.y+(b.y-a.y)*u,x1=d.x+(c.x-d.x)*u,y1=d.y+(c.y-d.y)*u;
  return{x:x0+(x1-x0)*v,y:y0+(y1-y0)*v};}
function invBil(q,x,y){var u=.5,v=.5;
  for(var i=0;i<10;i++){var p=bil(q,u,v),a=q[0],b=q[1],c=q[2],d=q[3];
    var dux=(b.x-a.x)*(1-v)+(c.x-d.x)*v,duy=(b.y-a.y)*(1-v)+(c.y-d.y)*v;
    var dvx=(d.x+(c.x-d.x)*u)-(a.x+(b.x-a.x)*u),dvy=(d.y+(c.y-d.y)*u)-(a.y+(b.y-a.y)*u);
    var det=dux*dvy-duy*dvx;if(Math.abs(det)<1e-6)break;
    var ex=p.x-x,ey=p.y-y;u-=(ex*dvy-ey*dvx)/det;v-=(dux*ey-duy*ex)/det;u=clamp(u,-1,2);v=clamp(v,-1,2);}
  return{u:u,v:v};}
function ringPos(){
  if(G.drag&&G.drag.type==='ring')return{x:G.drag.rx,y:G.drag.ry};
  return bil(G.C,G.ru,G.rv);
}

/* ================= 音（Web Audio 合成） ================= */
var AU=(function(){
  var ac=null,master=null,nb=null,ok=false;
  function init(){
    if(ac){try{if(ac.state==='suspended')ac.resume();}catch(e){}return;}
    try{var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC();
      master=ac.createGain();master.gain.value=0.75;var comp=ac.createDynamicsCompressor();master.connect(comp);comp.connect(ac.destination);
      nb=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);var d=nb.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      if(ac.state==='suspended')ac.resume();ok=true;}catch(e){ac=null;ok=false;}
  }
  function T(){return ac.currentTime+0.005;}
  function env(g,t,a,p,dc){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,p),t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dc);}
  function tone(type,f,t,a,p,dc,f2,dest){try{var o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+dc);o.connect(g);g.connect(dest||master);env(g,t,a,p,dc);o.start(t);o.stop(t+a+dc+0.05);}catch(e){}}
  function noise(t,dur,p,type,f,q,f2){try{var s=ac.createBufferSource();s.buffer=nb;var bf=ac.createBiquadFilter();bf.type=type;bf.frequency.setValueAtTime(f,t);if(f2)bf.frequency.exponentialRampToValueAtTime(f2,t+dur);bf.Q.value=q;var g=ac.createGain();s.connect(bf);bf.connect(g);g.connect(master);env(g,t,0.004,p,dur);s.start(t,Math.random()*1.5);s.stop(t+dur+0.1);}catch(e){}}
  function on(){return ok&&ac&&ac.state!=='closed';}
  return{
    init:init,state:function(){return ac?ac.state:'none';},
    metal:function(k){if(!on())return;var t=T(),b=1180*(k||1);[1,2.76,5.4,8.93].forEach(function(m,i){tone('sine',b*m,t,0.002,0.11/(i+1),0.9/(i*0.6+1));});noise(t,0.03,0.08,'highpass',3000,1);},
    creak:function(dist,ten,load){if(!on())return;var t=T(),f=48+dist*0.07+load*7;try{var o=ac.createOscillator(),bf=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*1.12,t+0.2);bf.type='bandpass';bf.frequency.value=650+ten*900+load*60;bf.Q.value=5;o.connect(bf);bf.connect(g);g.connect(master);env(g,t,0.02,0.06,0.2);o.start(t);o.stop(t+0.3);}catch(e){}},
    swish:function(a){if(!on())return;var t=T();noise(t,0.22,0.05*a+0.02,'bandpass',420,1.2,1700);},
    pattan:function(){if(!on())return;var t=T();noise(t,0.1,0.13,'lowpass',1100,0.8,300);tone('sine',150,t,0.004,0.16,0.14,70);},
    thump:function(){if(!on())return;var t=T();tone('sine',170,t,0.003,0.15,0.12,90);noise(t,0.05,0.06,'lowpass',700,1);},
    wood:function(){if(!on())return;var t=T();for(var i=0;i<9;i++)noise(t+i*0.09,0.03,0.07,'bandpass',1500+i*40,4);tone('triangle',110,t,0.05,0.05,0.8,96);},
    tick:function(){if(!on())return;var t=T();tone('sine',880+Math.random()*200,t,0.002,0.03,0.05);},
    splash:function(){if(!on())return;var t=T();noise(t,0.3,0.05,'lowpass',1400,0.7,300);},
    tug:function(n){if(!on())return;var t=T();this.creak(420+n*60,1,2);noise(t+0.12,0.08,0.09,'bandpass',900,2,400);tone('sine',300-n*40,t+0.12,0.003,0.06,0.15,200);},
    success:function(){if(!on())return;var t=T();[523.25,659.25,783.99,1046.5].forEach(function(f,i){tone('sine',f,t+i*0.085,0.004,0.13,0.45);tone('sine',f*4,t+i*0.085,0.002,0.02,0.12);});},
    big:function(){if(!on())return;var t=T();[392,493.9,587.3,740].forEach(function(f,i){tone('sine',f,t+i*0.05,0.06,0.09,1.7);tone('triangle',f/2,t+i*0.05,0.08,0.04,1.4);});tone('sine',1568,t+0.35,0.003,0.06,1.1);tone('sine',2349,t+0.5,0.003,0.04,0.9);},
    untie:function(){if(!on())return;var t=T();noise(t,0.5,0.1,'bandpass',3000,1.5,450);this.success();},
    sit:function(){if(!on())return;var t=T();tone('sine',330,t,0.01,0.05,0.3,300);}
  };
})();

var MAXP=90;

function relayoutTemp(){G.temp=G.temp.filter(function(c){return c.state==='temp';});}
function toTemp(c){if(G.temp.indexOf(c)<0)G.temp.push(c);c.state='temp';c.claim=null;c.z=0;}
function removeEverywhere(c){var i=G.temp.indexOf(c);if(i>=0)G.temp.splice(i,1);i=G.cra.indexOf(c);if(i>=0){G.cra.splice(i,1);}for(var s=0;s<3;s++)if(G.seats[s]===c)G.seats[s]=null;}
function craLayout(N){var b=N<=2?N:Math.ceil(N/2),t=N-b,res=[],j;
  for(j=0;j<b;j++)res.push({u:.5+(j-(b-1)/2)*.26,v:.6,z:0});
  for(j=0;j<t;j++){var uu=(t<b)?.5+(j-(t-1)/2)*.26:res[j].u;res.push({u:uu,v:.6,z:1});}
  return res;}
function relayoutCradle(fromUser){
  G.cra=G.cra.filter(function(c){return c.state==='canvas'||c.state==='loose'||c.state==='carried';});
  var L=craLayout(G.cra.length),li=0;
  G.cra.forEach(function(c,i){var s=L[i];c.slot=s;
    if(c.state==='carried')return;
    if(c.state==='canvas'){
      if(s.z>c.z&&!fromUser){c.state='loose';c.claim=null;c.lp=LOOSE[li%3];li++;}

    }else if(c.state==='loose'){

    }
  });

function tableSlots(F){var order=F.side<0?[.82,.5,.18]:[.18,.5,.82];return order;}
function tableFree(kind){
  var F=FORMS[G.form];if(F.k!=='table')return null;var order=tableSlots(F);
  var rows=[kind,1-kind];
  for(var r=0;r<2;r++){var v=rows[r]===0?.3:.72;
    for(var j=0;j<3;j++){var u=order[j],used=false;
      for(var i=0;i<crates.length;i++){var c=crates[i];
        if((c.state==='canvas'||(c.state==='carried'&&c.slotRes))&&c.slotRes&&Math.abs(c.slotRes.u-u)<.05&&Math.abs(c.slotRes.v-v)<.05){used=true;break;}
        if(c.state==='canvas'&&Math.abs(c.u-u)<.05&&Math.abs(c.v-v)<.05){used=true;break;}}
      if(!used)return{u:u,v:v,z:0};}}
  return null;}

function mkWorker(i,x,y,belt){return{i:i,x:x,y:y,reg:'near',path:[],think:0.5+i*0.3,carry:null,face:1,ph:0,moving:false,sitting:false,sitA:0,

function findSource(w,K){
  var best=null,bd=1e9,pr,i,c;
  for(i=0;i<crates.length;i++){c=crates[i];if(c.claim||c.long)continue;
    pr=-1;
    if(K==='bridge'||K==='hook'||K==='side'){if(c.state==='canvas')pr=0;else if(c.state==='seat')pr=1;else if(c.state==='temp'||c.state==='loose')pr=2;}
    else if(K==='table'){if(c.state==='seat')pr=1;}
    else if(K==='cradle'){if(c.state==='loose')pr=0;}
    if(pr<0)continue;
    var dd=pr*2000+hyp(c.x-w.x,c.y-w.y);if(dd<bd){bd=dd;best=c;}}
  if(best)return best;
  if(K==='bridge'||K==='hook'||K==='side'||K==='table'){
    if(K==='table'&&!tableFree(G.kindSeq%2===0?0:1)&&!tableFree(0)&&!tableFree(1))return null;

var KIND_SEQ=[0,1,1,0,1,0,0,1];
function goPick(w,src){

      var k=KIND_SEQ[G.kindSeq++%KIND_SEQ.length];var c=newCrate(k,PILE.x,PILE.y-30);c.state='carried';c.owner=w;w.carry=c;AU.tick();}}];return;}

function deliver(w){

  }

  }

  var ti=G.temp.length,tp=tempPos(ti);
  w.path=[{t:'p',x:tp.x,y:tp.y+22},{t:'do',f:function(w){if(w.carry===c){w.carry=null;toTemp(c);AU.thump();}}}];

function dropDest(w,d){

function cancelGroup(g){if(!g)return;[g.a,g.b].forEach(function(w){w.grp=null;w.carryLong=null;});

/* ===== 形が変わったとき ===== */
function setTargets(q){for(var i=0;i<4;i++){G.T[i].x=q[i].x;G.T[i].y=q[i].y;}}
function setForm(f,quiet){
  var prev=G.form,F=FORMS[f];
  G.Tq=F.qo.map(function(p){return{x:p.x,y:p.y};});
  setTargets(F.qo);G.rut=F.ru;G.rvt=F.rv;G.spring='settle';
  var rp=ringPos();
  if(!quiet){AU.pattan();fibers(F.ring[0],F.ring[1],6);}
  if(prev===f)return;
  G.form=f;G.formVer++;logEv('form:'+f);
  onFormCrates(prev,f);
  onFormWorkers();
  var K=F.k;
  if(K==='hook'){var i=F.stake;
    if(!G.platOpen[i]){G.platOpen[i]=true;AU.wood();logEv('rotate:'+i);}
    else{G.platWig[i]=1;AU.wood();}
    G.pref=i===0?'pL':'pR';
    if(!quiet)disc(i===0?'hookL':'hookR');}
  if(K==='bridge'&&!quiet){disc(F.wide?'bridgeWide':'bridgeNarrow');}
  if(K==='table'&&!quiet)disc(F.side<0?'tableL':'tableR');
  if(K==='cradle'&&!quiet&&G.cra.length>=1)disc('cradle');
  if(K==='shade'&&!quiet){if(!disc('shade',true))AU.big();}

  if(K!=='rest'&&G.model&&!G.model.fade){G.model.fade=true;}
  G.saveT=1;
}
function onFormCrates(prev,f){
  var F=FORMS[f],K=F.k,cc=canvasCrates();
  // 仮のゆるい箱は仮置きへ
  crates.forEach(function(c){if(c.state==='loose'&&K!=='cradle'){toTemp(c);}});
  if(K!=='cradle')G.cra=[];
  if(K==='bridge'||K==='hook'||K==='side'){
    cc.sort(function(a,b){return a.v-b.v;});
    cc.forEach(function(c,i){c.z=0;c.u=F.narrow?.5:(i%2?.66:.34);c.v=clamp(.22+i*(F.narrow?.14:.08),.15,.88);c.wob=1;});
  }else if(K==='table'){
    cc.forEach(function(c){c.state='floating';});
    cc.forEach(function(c){var s=tableFree(c.kind);if(s){c.state='canvas';c.u=s.u;c.v=s.v;c.z=0;c.wob=1;}else toTemp(c);});
  }else if(K==='cradle'){
    G.cra=cc.slice(0,6);cc.slice(6).forEach(toTemp);
    G.cra.forEach(function(c){c.z=0;});
    relayoutCradle(false);
  }else if(K==='shade'){
    var si=0;
    cc.forEach(function(c){while(si<3&&G.seats[si])si++;if(si<3){c.state='seat';c.seat=si;G.seats[si]=c;}else toTemp(c);});
    for(var s=0;s<3;s++){if(!G.seats[s]&&G.temp.length){var t=G.temp.pop();t.state='seat';t.seat=s;G.seats[s]=t;}}
  }else{cc.forEach(toTemp);}
  crates.forEach(function(c){if(c.state!=='carried'&&c.state!=='held')c.claim=null;});
}
function onFormWorkers(){
  workers.forEach(function(w){
    if(w.grp)cancelGroup(w.grp);

    if(w.carry&&w.carry.slotRes)w.carry.slotRes=null;
    if(w.onC){w.path=[{t:'c',u0:w.cu,v0:w.cv,u1:w.cu,v1:0,reg:'near',fast:true}];}
    else if(w.path.length&&w.path[0].t==='p'&&w.reg==='near'){w.path=[];}
    else if(w.reg!=='near'){w.path=[];}
    else w.path=[];
  });
}

function think(w){
  if(w.grp)return;
  var F=FORMS[G.form],K=F.k;
  if(K==='shade'){if(!w.sitting)goSit(w);return;}
  if(w.carry){deliver(w);return;}
  if(w.reg==='can'){w.path=routeTo(w,'near',null)||[];return;}
  if(K==='rest'){idle(w);return;}
  if(w.reg!=='near'){var hx=320+w.i*50,hy=700;w.path=routeTo(w,'near',hx,hy)||[];return;}
  if(K==='bridge'&&F.wide&&G.long&&G.long.state==='pile'&&!G.long.claim){if(tryLong(w))return;}
  var src=findSource(w,K);if(!src){idle(w);return;}
  goPick(w,src);
}
function stepWorker(w,dt){
  w.moving=false;
  if(w.wob>0)w.wob=Math.max(0,w.wob-dt*2.5);
  if(w.sitting){w.sitA=Math.min(1,w.sitA+dt*3);return;}else w.sitA=Math.max(0,w.sitA-dt*4);
  if(!w.path.length){w.think-=dt;if(w.think<=0){w.think=0.35;think(w);}
    if(!w.path.length&&w.look){var lx=w.look.x-w.x;if(Math.abs(lx)>10)w.face=lx>0?1:-1;
      w.point=(!w.carry&&Math.sin(G.t*1.1+w.i*2.1)>0.55)?1:0;}
    return;}
  w.point=0;
  var s=w.path[0];
  if(s.t==='p'){
    var dx=s.x-w.x,dy=s.y-w.y,d=hyp(dx,dy),sp=w.spd*dt;
    if(d<=sp){w.x=s.x;w.y=s.y;w.path.shift();}else{w.x+=dx/d*sp;w.y+=dy/d*sp;w.moving=true;if(Math.abs(dx)>2)w.face=dx>0?1:-1;}
    w.onC=false;
  }else if(s.t==='c'){
    var F=FORMS[G.form];
    if(s.s===undefined){
      var dir=s.v1>=s.v0?1:-1;
      if(!s.fast){var unset=0;for(var ci=0;ci<4;ci++)unset=Math.max(unset,hyp(G.C[ci].x-G.T[ci].x,G.C[ci].y-G.T[ci].y));if(unset>18&&!(G.drag&&G.drag.type==='ring'))return;}
      if(F.narrow&&!s.fast&&!s.sync){for(var i=0;i<workers.length;i++){var o=workers[i];if(o!==w&&o.onC&&o.dir!==dir&&o.cv>0.04&&o.cv<0.96){w.stuck+=dt;if(w.stuck<6)return;}}}
      w.stuck=0;s.s=0;w.dir=dir;
    }
    var a=bil(G.C,s.u0,s.v0),b=bil(G.C,s.u1,s.v1),L=Math.max(1,hyp(b.x-a.x,b.y-a.y));
    var spd=(s.spd||w.spd)*(F.narrow?0.82:1)*(s.fast?2:1);
    if(F.narrow&&!s.fast){var c0=bil(G.C,.5,0),c1=bil(G.C,.5,1),Lc=hyp(c1.x-c0.x,c1.y-c0.y);
      for(var j=0;j<workers.length;j++){var o2=workers[j];if(o2!==w&&o2.onC&&o2.dir===w.dir&&(o2.cv-w.cv)*w.dir>0&&Math.abs(o2.cv-w.cv)*Lc<46){spd=0;break;}}}
    s.s=Math.min(1,s.s+spd*dt/L);
    w.cu=lerp(s.u0,s.u1,s.s);w.cv=lerp(s.v0,s.v1,s.s);
    var p=bil(G.C,w.cu,w.cv);
    if(Math.abs(p.x-w.x)>0.5)w.face=p.x>w.x?1:-1;

  }else if(s.t==='tp'){w.x=s.x;w.y=s.y;w.reg=s.reg;w.onC=false;w.path.shift();}

function hintTarget(){
  var d=G.disc,f;
  if(!d.bridgeNarrow)f='BRN';
  else if(!d.bridgeWide)f='BRWR';
  else if(!d.tableL&&!d.tableR)f='TABR';
  else if(!d.hookL&&!d.hookR)f='HKL';
  else if(!d.hookL||!d.hookR)f=d.hookL?'HKR':'HKL';
  else if(!d.cradle2&&canvasCrates().length>=3&&FORMS[G.form].k==='table')f='CRA';
  else if(!d.cradle2&&FORMS[G.form].k!=='cradle')f=d.tableL?'TABL':'TABR';
  else if(!d.shade)f='SHD';
  else if(!d.side)f='SIDE';
  else if(!d.tableL||!d.tableR)f=d.tableL?'TABR':'TABL';
  else f=null;
  if(f===G.form&&f!=='CRA')f=(f==='SIDE')?'BRN':null;
  if(!f)return null;
  return{x:FORMS[f].ring[0],y:FORMS[f].ring[1],f:f};
}
function guideCrate(){
  if(G.form!=='CRA'||G.disc.craLess)return null;
  if(!G.disc.cradle2)return null;

}

function dragShape(P){
  var d=hyp(P.x-A.x,P.y-A.y),h=Math.min(50,20+d*0.25);
  var base=P2(d<4?FORMS.REST.q:strip(P.x,P.y,h)),ru=.5,rv=1,best=null,bt=0;
  for(var i=0;i<FORM_KEYS.length;i++){var k=FORM_KEYS[i],F=FORMS[k];if(k==='REST'||(k==='SIDE'&&!G.untied))continue;
    var dd=hyp(P.x-F.ring[0],P.y-F.ring[1]),t=sm(1-dd/150);if(t>bt){bt=t;best=F;}}
  if(d<120){var tr=sm(1-d/120);base=lerpQ(base,FORMS.REST.qo,tr*0.6);}
  if(best&&bt>0){var ox=P.x-best.ring[0],oy=P.y-best.ring[1];
    var fq=best.qo.map(function(p,i){var k=i>=2?1:0.2;return{x:p.x+ox*k,y:p.y+oy*k};});
    base=lerpQ(base,fq,bt);ru=lerp(ru,best.ru,bt);rv=lerp(rv,best.rv,bt);}
  return{q:base,ru:ru,rv:rv,near:best,nt:bt};
}
function lerpQ(a,b,t){return a.map(function(p,i){return{x:lerp(p.x,b[i].x,t),y:lerp(p.y,b[i].y,t)};});}
function clampReach(p){
  var dx=p.x-A.x,dy=p.y-A.y,d=hyp(dx,dy),R=G.rmax;
  if(d<=R)return{x:p.x,y:p.y,over:0,d:d};
  var e=R+18*(1-Math.exp(-(d-R)/60));return{x:A.x+dx/d*e,y:A.y+dy/d*e,over:d-R,d:e};
}
function nearestForm(p){
  var d0=hyp(p.x-A.x,p.y-A.y);if(d0<150)return'REST';
  var best='REST',bd=1e9;
  FORM_KEYS.forEach(function(k){if(k==='SIDE'&&!G.untied)return;var F=FORMS[k];var d=hyp(p.x-F.ring[0],p.y-F.ring[1]);if(d<bd){bd=d;best=k;}});

}
function tug(){

var SKEY='gf261109_8_harbor_v1';
function snapshot(){

    can:canvasCrates().slice(0,8).map(function(c){return{k:c.kind,u:+c.u.toFixed(3),v:+c.v.toFixed(3)};}),

}
function saveNow(){if(!G.canSave)return;try{localStorage.setItem(SKEY,JSON.stringify(snapshot()));G.saveState='saved';}catch(e){G.canSave=false;G.saveState='denied';logEv('saveDenied');}}
function validSave(d){
  if(!d||d.v!==1)return false;
  if(!(d.knot>=0&&d.knot<=3&&(d.knot|0)===d.knot))return false;
  if(!Array.isArray(d.plat)||d.plat.length!==2)return false;
  if(typeof d.form!=='string'||!FORMS[d.form])return false;
  if(!Array.isArray(d.can)||d.can.length>8)return false;
  for(var i=0;i<d.can.length;i++){var c=d.can[i];if(!c||!(c.k===0||c.k===1)||!(c.u>=0&&c.u<=1)||!(c.v>=0&&c.v<=1))return false;}
  if(!Array.isArray(d.tmp)||d.tmp.length>10)return false;
  for(i=0;i<d.tmp.length;i++)if(!(d.tmp[i]===0||d.tmp[i]===1))return false;
  if(d.seat&&(!Array.isArray(d.seat)||d.seat.length!==3))return false;
  if(d.form==='SIDE'&&d.knot<3)return false;
  return true;
}
function loadSave(){
  var raw=null;
  try{raw=localStorage.getItem(SKEY);}catch(e){G.canSave=false;G.saveState='denied';logEv('loadDenied');return null;}
  if(!raw){G.saveState='empty';return null;}
  try{var d=JSON.parse(raw);if(!validSave(d))throw 0;G.saveState='found';return d;}
  catch(e){G.saveState='corrupt';logEv('saveCorrupt');try{localStorage.removeItem(SKEY);}catch(e2){}return null;}
}
function restoreFromModel(){

/* ================= 更新 ================= */
var lastT=0,raf=0;
function update(dt){
  G.t+=dt;G.hop+=dt;
  if(!G.drag)G.idle+=dt;
  // デモ（初回だけ）
  if(G.demo.state===0&&G.idle>4&&!G.touched&&G.form==='REST'){G.demo.state=1;G.demo.t=0;logEv('demo');}
  if(G.demo.state===1){G.demo.t+=dt;if(G.demo.t>2.6||G.form!=='REST')G.demo.state=2;}
  // 帆布の目標
  var F=FORMS[G.form];
  if(G.drag&&G.drag.type==='ring'&&G.drag.moved){
    var ds=dragShape({x:G.drag.rx,y:G.drag.ry});setTargets(ds.q);G.rut=ds.ru;G.rvt=ds.rv;G.dragNear=ds.near&&ds.nt>0.35?ds.near:null;
  }else if(G.boing>0){
    G.boing-=dt;var ds2=dragShape(G.boingP);setTargets(ds2.q);G.rut=ds2.ru;G.rvt=ds2.rv;
    if(G.boing<=0){setTargets(F.qo);G.rut=F.ru;G.rvt=F.rv;}
  }else if(G.demo.state===1&&G.demo.t>0.5&&G.demo.t<1.8){
    var k=sm((G.demo.t-0.5)/0.6)*(1-sm((G.demo.t-1.3)/0.5)),tp={x:A.x,y:lerp(688,560,k)};var ds3=dragShape(tp);setTargets(ds3.q);
  }else{setTargets(F.qo);G.rut=F.ru;G.rvt=F.rv;G.dragNear=null;}
  if(!G.drag||G.drag.type!=='ring')G.dragNear=null;
  var kk=G.spring==='drag'&&G.drag?900:190,dd=G.spring==='drag'&&G.drag?48:11;
  var steps=Math.ceil(dt/0.008),h=dt/steps;
  for(var s=0;s<steps;s++)for(var i=0;i<4;i++){var c=G.C[i],t=G.T[i];
    c.vx+=((t.x-c.x)*kk-c.vx*dd)*h;c.vy+=((t.y-c.y)*kk-c.vy*dd)*h;c.x+=c.vx*h;c.y+=c.vy*h;}
  G.ru=lerp(G.ru,G.rut,Math.min(1,dt*10));G.rv=lerp(G.rv,G.rvt,Math.min(1,dt*10));
  var rest=(G.form==='REST'&&!(G.drag&&G.drag.type==='ring'&&G.drag.moved)&&G.boing<=0);
  G.fold=lerp(G.fold,rest?1:0,Math.min(1,dt*(rest?3:8)));
  if(!(G.drag&&G.drag.type==='ring'))G.press=Math.max(0,G.press-dt*3);
  var rp=ringPos(),len=hyp(rp.x-A.x,rp.y-A.y);
  G.ten=clamp(len/360,0,1.2)*0.7+G.press*0.5;
  G.warm=lerp(G.warm,G.form==='SHD'?1:0,Math.min(1,dt*1.2));
  G.shade=lerp(G.shade,G.form==='SHD'?1:0,Math.min(1,dt*3));
  if(G.knotShake)G.knotShake=Math.max(0,G.knotShake-dt*2);
  // 台の回転
  for(i=0;i<2;i++){var ta=G.platOpen[i]?PL_OPEN[i]:PL_CLOSED[i];var da=ta-G.platAng[i];
    while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;
    var stp=dt*1.6;if(Math.abs(da)<stp)G.platAng[i]=ta;else G.platAng[i]+=stp*(da>0?1:-1);
    if(G.platWig[i]>0)G.platWig[i]=Math.max(0,G.platWig[i]-dt*1.5);}
  // 作業人形
  for(i=0;i<workers.length;i++)stepWorker(workers[i],dt);
  // 箱の位置
  updateCrates(dt);
  // 届け先の回収
  ['land','pL','pR'].forEach(function(k){var D=DEST[k];D.list=D.list.filter(function(c){return c.state==='dest';});
    if(D.list.length>=4&&!D.col){D.col=2.2;}
    if(D.col>0){D.col-=dt;if(D.col<=0.8){D.list.forEach(function(c){c.a=Math.max(0,c.a-dt*1.4);});}
      if(D.col<=0){D.list.forEach(function(c){c.state='gone';});D.list=[];D.col=0;}}});
  var B=G.boat,BD=DEST.boat;BD.list=BD.list.filter(function(c){return c.state==='dest';});
  if(BD.list.length>=4&&B.away<=0){B.away=9;logEv('boatAway');}
  if(B.away>0){B.away-=dt;B.x=90-Math.sin(clamp((9-B.away)/9,0,1)*Math.PI)*420;if(B.away<5&&BD.list.length){BD.list.forEach(function(c){c.state='gone';});BD.list=[];}
    if(B.away<=0){B.away=0;B.x=90;}}
  crates=crates.filter(function(c){return c.state!=='gone';});
  // 休憩の湯気
  if(G.warm>0.6&&Math.random()<dt*3)steam(860,878-46*KY);
  // 粒子
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.age+=dt;if(p.age>=p.life){parts.splice(i,1);continue;}
    if(p.vx!==undefined){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t==='f'){p.vy+=60*dt;p.vx*=0.98;}}}
  if(G.saveT>0){G.saveT-=dt;if(G.saveT<=0)saveNow();}
  if(G.model){if(G.model.fade)G.model.a=Math.max(0,G.model.a-dt*1.5);if(G.model.a<=0&&G.model.fade)G.model=null;}
}
function updateCrates(dt){
  var F=FORMS[G.form],load=canvasCrates().length,k=Math.min(1,dt*10);
  crates.forEach(function(c){
    if(c.wob>0)c.wob=Math.max(0,c.wob-dt*2);
    var tx=c.x,ty=c.y;
    if(c.state==='canvas'){var p=bil(G.C,c.u,c.v);tx=p.x;ty=p.y+sagAt(c.u,c.v,load);c.zs=lerp(c.zs,c.z,k);}
    else if(c.state==='temp'){var i=G.temp.indexOf(c),tp=tempPos(i);tx=tp.x;ty=tp.y;c.zs=lerp(c.zs,tp.z,k);}
    else if(c.state==='seat'){var sp=SEATS[c.seat];tx=sp.x;ty=sp.y;c.zs=lerp(c.zs,0,k);}
    else if(c.state==='loose'){tx=c.lp.x;ty=c.lp.y;c.zs=lerp(c.zs,0,k);}
    else if(c.state==='carried'){var w=c.owner;if(c.long&&w&&w.a){tx=(w.a.x+w.b.x)/2;ty=(w.a.y+w.b.y)/2;}else if(w&&w.x!==undefined){tx=w.x;ty=w.y;}c.zs=lerp(c.zs,0,k);}
    else if(c.state==='dest'){var D=DEST[c.dest],j=D.list.indexOf(c);
      if(c.dest==='boat'){tx=G.boat.x+(-20+(j%2)*40)*KX;ty=418-(j/2|0)*8*KY;}
      else if(c.long){tx=D.x;ty=D.y-30;}
      else{tx=D.x+(-24+(j%2)*48)*KX;ty=D.y+((j/2|0))*0;c.zs=lerp(c.zs,(j/2|0),k);}}

function drawModel(){var M=G.model;if(!M)return;var d=M.data;
  obj(MODEL.x,MODEL.y);cx.scale(1.25,1.25);cx.globalAlpha=M.a;var x=0,y=0;
  drawGlow(x,y-20,72,0.2);
  shadowE(x,y+4,60,10,0.3);
  cx.fillStyle=PAT.wood;cx.fillRect(x-56,y-36,112,40);cx.fillStyle='rgba(30,18,8,0.35)';cx.fillRect(x-56,y-4,112,8);
  // 小さな港
  cx.fillStyle='#55646a';cx.fillRect(x-50,y-34,100,10);cx.fillStyle='#2c3e46';cx.fillRect(x-50,y-24,100,12);cx.fillStyle='#636a6e';cx.fillRect(x-50,y-12,100,10);
  var F=FORMS[d.form];cx.save();cx.translate(x-50,y-34);cx.scale(0.1,0.036);cx.translate(0,-250);
  cx.fillStyle='#2b3f6e';cx.beginPath();var q=F.qo;cx.moveTo(q[0].x,q[0].y);for(var i=1;i<4;i++)cx.lineTo(q[i].x,q[i].y);cx.closePath();cx.fill();cx.restore();
  for(i=0;i<Math.min(4,d.can.length+d.tmp.length);i++){cx.fillStyle=i%2?'#8e3f24':'#a17c4e';cx.fillRect(x-40+i*9,y-10,7,6);}
  for(i=0;i<2;i++){cx.fillStyle=d.plat[i]?'#c7a35a':'#5e4429';cx.beginPath();cx.ellipse(x+(i?38:-38),y-33,6,3,0,0,TAU);cx.fill();}
  cx.restore();}

/* ================= 帆布の描画 ================= */
function drawCanvasShape(elev){
  var q=G.C,F=FORMS[G.form];
  var a=q[0],b=q[1],d=q[3];
  var lu=hyp(b.x-a.x,b.y-a.y),lv=hyp(d.x-a.x,d.y-a.y);
  // 水上の影
  if(!elev){cx.save();cx.translate(6,14);quadPath(q);cx.fillStyle='rgba(5,10,15,0.28)';cx.fill();cx.restore();}
  cx.save();quadPath(q);cx.clip();
  if(lu>2&&lv>2){cx.save();cx.transform((b.x-a.x)/lu,(b.y-a.y)/lu,(d.x-a.x)/lv,(d.y-a.y)/lv,a.x,a.y);cx.fillStyle=PAT.weave;cx.fillRect(-20,-20,lu+40,lv+40);cx.restore();}
  else{cx.fillStyle='#253a63';cx.fillRect(0,0,1000,1000);}
  // たるみの陰影
  var load=canvasCrates().length,mid=bil(q,.5,.55);
  var sg=cx.createRadialGradient(mid.x,mid.y,0,mid.x,mid.y,Math.max(60,Math.min(lu,lv)*0.7));
  var sagA=F.k==='cradle'?0.18+load*0.06:(F.k==='table'?0.06+load*0.03:0.05+load*0.02);
  sg.addColorStop(0,'rgba(5,10,25,'+clamp(sagA,0,0.5)+')');sg.addColorStop(1,'rgba(5,10,25,0)');cx.fillStyle=sg;cx.fillRect(mid.x-400,mid.y-400,800,800);
  var lg=cx.createLinearGradient(a.x,a.y,d.x,d.y);lg.addColorStop(0,'rgba(0,0,0,0.12)');lg.addColorStop(1,'rgba(160,185,230,0.10)');cx.fillStyle=lg;cx.fillRect(Math.min(a.x,d.x,b.x)-50,Math.min(a.y,d.y,b.y)-50,600,600);
  // たたまれた折り目
  if(G.fold>0.02){for(var i=0;i<6;i++){var p0=bil(q,0,i/6),p1=bil(q,1,i/6),p2=bil(q,1,(i+0.5)/6),p3=bil(q,0,(i+0.5)/6);
    cx.fillStyle='rgba(5,10,25,'+(0.3*G.fold)+')';cx.beginPath();cx.moveTo(p0.x,p0.y);cx.lineTo(p1.x,p1.y);cx.lineTo(p2.x,p2.y);cx.lineTo(p3.x,p3.y);cx.fill();
    var h0=bil(q,0,(i+0.5)/6),h1=bil(q,1,(i+0.5)/6);cx.strokeStyle='rgba(140,165,215,'+(0.22*G.fold)+')';cx.lineWidth=2;cx.beginPath();cx.moveTo(h0.x,h0.y);cx.lineTo(h1.x,h1.y);cx.stroke();}}
  // 張った織り目
  var tn=clamp(G.ten,0,1.4);
  cx.strokeStyle='rgba(150,175,225,'+(0.08+tn*0.22)+')';cx.lineWidth=1.4;
  for(i=1;i<6;i++){var s0=bil(q,i/6,0.02),s1=bil(q,i/6,0.98);cx.beginPath();cx.moveTo(s0.x,s0.y);cx.lineTo(s1.x,s1.y);cx.stroke();}
  // 押し沈み（指・足・箱）
  var rp=bil(q,G.ru,G.rv);
  if(G.press>0.01){var pu=G.ru,pv=G.rv-0.08*Math.sign(G.rv-0.5||1),pp=bil(q,clamp(pu,.1,.9),clamp(pv,.1,.9));
    var dg=cx.createRadialGradient(pp.x,pp.y,0,pp.x,pp.y,46);dg.addColorStop(0,'rgba(0,4,15,'+(0.55*G.press)+')');dg.addColorStop(0.7,'rgba(0,4,15,'+(0.15*G.press)+')');dg.addColorStop(1,'rgba(0,4,15,0)');
    cx.fillStyle=dg;cx.beginPath();cx.arc(pp.x,pp.y,46,0,TAU);cx.fill();
    cx.strokeStyle='rgba(170,195,240,'+(0.35*G.press)+')';cx.lineWidth=1.5;for(i=0;i<5;i++){var an=i/5*Math.PI+0.3;cx.beginPath();cx.moveTo(pp.x+Math.cos(an)*14,pp.y+Math.sin(an)*8);cx.lineTo(pp.x+Math.cos(an)*44,pp.y+Math.sin(an)*26);cx.stroke();}}
  workers.forEach(function(w){if(!w.onC)return;var dg2=cx.createRadialGradient(w.x,w.y,0,w.x,w.y,F.narrow?30:22);dg2.addColorStop(0,'rgba(0,4,15,0.35)');dg2.addColorStop(1,'rgba(0,4,15,0)');cx.fillStyle=dg2;cx.beginPath();cx.arc(w.x,w.y,30,0,TAU);cx.fill();});
  crates.forEach(function(c){if(c.state!=='canvas')return;var r=F.k==='cradle'?40:30;var dg3=cx.createRadialGradient(c.x,c.y,0,c.x,c.y,r);dg3.addColorStop(0,'rgba(0,4,15,'+(F.k==='cradle'?0.45:0.3)+')');dg3.addColorStop(1,'rgba(0,4,15,0)');cx.fillStyle=dg3;cx.beginPath();cx.arc(c.x,c.y,r,0,TAU);cx.fill();});
  cx.restore();
  // 縁（ヘム）と金具
  quadPath(q);cx.strokeStyle='rgba(20,30,55,0.75)';cx.lineWidth=6;cx.stroke();
  quadPath(q);cx.strokeStyle='rgba(120,145,200,0.25)';cx.lineWidth=1.5;cx.stroke();
  for(i=0;i<4;i++){cx.fillStyle='#9d7c36';cx.beginPath();cx.arc(q[i].x,q[i].y,4,0,TAU);cx.fill();}
  // 結ばれた縄
  if(G.fold>0.05){cx.save();cx.globalAlpha=G.fold;for(i=0;i<2;i++){var r0=bil(q,-0.06,0.3+i*0.4),r1=bil(q,1.06,0.3+i*0.4);rope(r0.x,r0.y,r1.x,r1.y,3,6);}cx.restore();}
}
function drawRing(){
  var rp=ringPos(),cp=bil(G.C,G.ru,G.rv),x=rp.x,y=rp.y;
  var gd=!guideCrate();
  var hop=0;if(gd&&!G.drag&&G.boing<=0){var ph=(G.hop%(G.idle>4?1.6:2.4));if(ph<0.4)hop=-Math.sin(ph/0.4*Math.PI)*(G.idle>4?12:7);}
  y+=hop;
  if(gd&&!G.drag)drawGlow(x,y,70,0.22+0.14*Math.sin(G.t*3));
  rope(cp.x,cp.y,x,y+24*KY,2,5);
  var sc=1-G.press*0.12;obj(x,y);cx.scale(sc,sc);
  shadowE(4,34,26,7,0.25);
  var g=cx.createLinearGradient(-36,-36,36,36);g.addColorStop(0,'#e3c87e');g.addColorStop(0.45,'#b8913f');g.addColorStop(1,'#6e521c');
  cx.strokeStyle=g;cx.lineWidth=12;cx.beginPath();cx.arc(0,0,30,0,TAU);cx.stroke();
  cx.strokeStyle='rgba(255,240,200,0.55)';cx.lineWidth=3;cx.beginPath();cx.arc(0,0,32,-2.6,-1.5);cx.stroke();
  cx.strokeStyle='rgba(60,40,10,0.45)';cx.lineWidth=1;for(var i=0;i<7;i++){var a=i*0.9+0.4;cx.beginPath();cx.arc(0,0,27+(i%3)*3,a,a+0.25);cx.stroke();}
  cx.fillStyle='#8f7348';cx.fillRect(-7,22,14,10);
  cx.restore();
}
function drawHint(){
  // ドラッグ中だけ、次の行き先がうっすら光る
  if(!(G.drag&&G.drag.type==='ring'&&G.drag.moved))return;
  var h=hintTarget();if(h){var pul=0.5+0.5*Math.sin(G.t*5);drawGlow(h.x,h.y,46,0.18+0.18*pul);}
  if(G.dragNear){var r=G.dragNear.ring;drawGlow(r[0],r[1],40,0.35);}
}
function drawHand(){
  if(G.demo.state!==1)return;var t=G.demo.t,a=sm(t/0.3)*(1-sm((t-2.2)/0.4));
  var k=sm((t-0.5)/0.6)*(1-sm((t-1.3)/0.5)),x=A.x+12*KX,y=lerp(688,560,k)+(18+(t<0.5?(1-t/0.5)*30:0))*KY;
  obj(x,y);cx.globalAlpha=a*0.85;
  cx.fillStyle='rgba(210,170,130,0.9)';cx.beginPath();cx.ellipse(10,34,20,26,-0.2,0,TAU);cx.fill();
  limb(0,14,-2,-8,11,'rgba(220,182,140,0.95)');
  limb(14,18,20,6,10,'rgba(200,160,120,0.9)');limb(24,24,30,14,9,'rgba(200,160,120,0.9)');
  cx.restore();
}
function drawParts(){
  for(var i=0;i<parts.length;i++){var p=parts[i],k=1-p.age/p.life;
    if(p.t==='f'){cx.strokeStyle=p.col;cx.globalAlpha=k;cx.lineWidth=1.4;cx.beginPath();cx.moveTo(p.x,p.y);cx.quadraticCurveTo(p.x+3,p.y-3,p.x+6*Math.cos(p.r+p.age*4),p.y+6*Math.sin(p.r+p.age*4));cx.stroke();}
    else if(p.t==='d'){cx.fillStyle='rgba(170,170,160,'+(0.5*k)+')';cx.beginPath();cx.arc(p.x,p.y,3,0,TAU);cx.fill();}
    else if(p.t==='r'){cx.strokeStyle='rgba(190,210,215,'+(0.5*k)+')';cx.lineWidth=2;cx.beginPath();cx.ellipse(p.x,p.y,10+p.age*40,4+p.age*14,0,0,TAU);cx.stroke();}
    else if(p.t==='s'){cx.fillStyle='rgba(225,225,220,'+(0.25*k)+')';cx.beginPath();cx.arc(p.x,p.y,5+p.age*6,0,TAU);cx.fill();}
    else if(p.t==='g'){drawGlow(p.x,p.y,30,0.4*k);}
  }cx.globalAlpha=1;
}
function drawWater(){
  cx.strokeStyle='rgba(170,195,200,0.10)';cx.lineWidth=2;
  for(var i=0;i<ripples.length;i++){var r=ripples[i];var x=((r.x+G.t*r.s)%1400+1400)%1400-200;
    if(x<VX0-60||x>VX1+60)continue;cx.beginPath();cx.moveTo(x,r.y);cx.quadraticCurveTo(x+r.l/2,r.y-3+Math.sin(G.t*1.5+r.p)*2,x+r.l,r.y);cx.stroke();}
}
function render(){
  cx.setTransform(1,0,0,1,0,0);cx.drawImage(bg,0,0);
  setWorld();
  drawWater();
  // 対岸の台と縄
  for(var i=0;i<2;i++){drawPlatform(i);}
  for(i=0;i<2;i++){var pc=platContact(i),s=STK[i],hooked=FORMS[G.form].k==='hook'&&FORMS[G.form].stake===i;rope(s.x,s.y-26*KY,pc.x,pc.y,hooked?0:16,4);}
  var shadeTop=G.shade>0.5;
  if(!shadeTop)drawCanvasShape(false);else{cx.save();cx.globalAlpha=G.shade;cx.fillStyle='rgba(8,14,20,0.42)';cx.beginPath();cx.moveTo(512,640);cx.lineTo(694,905);cx.lineTo(870,860);cx.closePath();cx.fill();cx.restore();}
  // 奥行きで並べる
  var L=[],L2=[];
  workers.forEach(function(w){(shadeTop&&w.sitA>0.2?L2:L).push({y:w.y,f:drawWorker,o:w});});
  crates.forEach(function(c){if(c.state==='carried'&&!c.long)return;if(c.state==='held')return;(shadeTop&&c.state==='seat'?L2:L).push({y:c.state==='canvas'?c.y+1:c.y,f:drawCrate,o:c});});
  for(i=0;i<2;i++)L.push({y:STK[i].y,f:drawStake,o:i});
  L.push({y:PILLAR.y,f:drawPillar});L.push({y:A.y+4,f:drawAnchor});L.push({y:440,f:drawBoat});L.push({y:878,f:drawKettle});
  if(G.model)L.push({y:MODEL.y,f:drawModel});
  // 荷置きの山（固定の見た目）
  L.push({y:PILE.y,f:drawPile});
  L.sort(function(a,b){return a.y-b.y;});
  for(i=0;i<L.length;i++)L[i].f(L[i].o);
  if(shadeTop){drawCanvasShape(true);L2.sort(function(a,b){return a.y-b.y;});for(i=0;i<L2.length;i++)L2[i].f(L2[i].o);}
  drawHint();
  var gc=guideCrate();if(gc&&!G.drag){drawGlow(gc.x,gc.y-gc.zs*32-20,50,0.25+0.15*Math.sin(G.t*3));}
  drawRing();
  if(G.drag&&G.drag.type==='crate')drawCrate(G.drag.c);
  drawParts();
  if(G.warm>0.01){cx.setTransform(1,0,0,1,0,0);cx.fillStyle='rgba(214,132,52,'+(0.17*G.warm)+')';cx.fillRect(0,0,cv.width,cv.height);setWorld();}
  drawHand();
}
var PILE_SHOW=[{x:-46,y:20,k:0,z:0},{x:0,y:20,k:1,z:0},{x:46,y:20,k:0,z:0},{x:-23,y:20,k:1,z:1},{x:23,y:20,k:0,z:1}];
function drawPile(){PILE_SHOW.forEach(function(p,i){var c={x:PILE.x+p.x*KX,y:PILE.y+p.y,zs:p.z,kind:p.k,a:1,wob:0,id:i,state:'pile'};drawCrate(c);});}

/* ================= ループ ================= */
function frame(now){
  raf=0;if(!G.vis)return;
  var dt=lastT?(now-lastT)/1000:0.016;lastT=now;dt=clamp(dt,0,0.05);
  update(dt);render();
  raf=requestAnimationFrame(frame);
}
function start(){if(!raf&&G.vis){lastT=0;raf=requestAnimationFrame(frame);}}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){G.vis=false;if(raf){cancelAnimationFrame(raf);raf=0;}if(G.ptr!==null){G.ptr=null;onUp({x:0,y:0},true);}saveNow();}
  else{G.vis=true;lastT=0;start();}
});
window.addEventListener('pagehide',function(){saveNow();});
var rzT=0;window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resize,60);});
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});

/* ================= 初期化 ================= */
buildTextures();
for(var ri=0;ri<30;ri++)ripples.push({x:srnd()*1400,y:350+srnd()*230,l:20+srnd()*40,s:6+srnd()*10,p:srnd()*6});
initCanvasShape();
workers.push(mkWorker(0,420,660,'#8e3f24'),mkWorker(1,250,740,'#2b3f6e'),mkWorker(2,330,700,'#b9a27a'));
(function(){var c=newCrate(1,420,660);c.state='carried';c.owner=workers[0];workers[0].carry=c;workers[0].face=1;
  workers[0].look={x:500,y:334};workers[1].look={x:PILE.x,y:PILE.y};workers[2].look={x:500,y:688};workers[2].point=1;})();
var saved=loadSave();
if(saved){G.model={data:saved,a:1,fade:false};logEv('modelShown');}
resize();
start();

// 自動検査用の読み取り口（UIではない）
window.__harbor={G:G,FORMS:FORMS,workers:workers,get crates(){return crates;},
  step:function(sec){var n=Math.ceil(sec*60);for(var i=0;i<n;i++)update(1/60);render();},
  w2s:function(x,y){return{x:OX+x*SX,y:OY+y*SY};},ring:function(){var r=ringPos();return{x:OX+r.x*SX,y:OY+r.y*SY};},
  snapshot:snapshot,setForm:function(f){setForm(f);}};
})();
</script>
