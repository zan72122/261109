<script>
(function(){'use strict';
/* ===== 基本 ===== */
const PAL={g:'#1a2131',cob:['#2156ad','#2b63bd','#1b4996'],red:['#d4462b','#df5838','#c03b24'],yel:['#efbd36','#f6ca4d','#e1ad2a'],milk:['#f1e9d6','#f8f2e4','#e5dbc4'],jade:['#35a083','#43af91','#2b8b71']};
const GROUT=PAL.g;
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v), lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy||1;const t=clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1);return Math.hypot(px-ax-dx*t,py-ay-dy*t);}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sh(k,r){const a=PAL[k],v=r();return v<.62?a[0]:(v<.86?a[1]:a[2]);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
let DPR=1,SW=1,SH=1,U=1,VW=700,VH=700,portrait=false;
const SA={t:0,r:0,b:0,l:0};

/* ===== モザイク生成 ===== */
function poly(g,pts,colorAt,r,gap){
  let cx=0,cy=0;for(const p of pts){cx+=p[0];cy+=p[1];}cx/=pts.length;cy/=pts.length;
  const col=colorAt(cx,cy,r);if(!col)return;
  g.fillStyle=col;g.beginPath();
  for(let k=0;k<pts.length;k++){const p=pts[k],dx=p[0]-cx,dy=p[1]-cy,d=Math.hypot(dx,dy)||1,f=Math.max(0,(d-gap)/d);const X=cx+dx*f,Y=cy+dy*f;if(k)g.lineTo(X,Y);else g.moveTo(X,Y);}
  g.closePath();g.fill();
}
function tileFill(g,x0,y0,w,h,tile,colorAt,r,gap){
  const nx=Math.ceil(w/tile)+3,ny=Math.ceil(h/(tile*.86))+3,P=[];
  for(let j=0;j<ny;j++){const row=[];for(let i=0;i<nx;i++){row.push([x0+(i-1.5+(j%2)*.5)*tile+(r()-.5)*tile*.62,y0+(j-1)*tile*.86+(r()-.5)*tile*.5]);}P.push(row);}
  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    const a=P[j][i],b=P[j][i+1],c=P[j+1][i+1],d=P[j+1][i],v=r();
    if(v<.5)poly(g,[a,b,c,d],colorAt,r,gap);
    else if(v<.76){poly(g,[a,b,c],colorAt,r,gap);poly(g,[a,c,d],colorAt,r,gap);}
    else{poly(g,[a,b,d],colorAt,r,gap);poly(g,[b,c,d],colorAt,r,gap);}
  }
}
function makeSpr(w,h,shape,colorAt,tile,seed,opt){
  opt=opt||{};const pad=6,res=opt.res||1,s=U*DPR*res;
  const c=document.createElement('canvas');
  c.width=Math.max(1,Math.ceil((w+pad*2)*s));c.height=Math.max(1,Math.ceil((h+pad*2)*s));
  const g=c.getContext('2d');g.scale(s,s);g.translate(pad,pad);
  const r=rng(seed);
  g.save();g.beginPath();shape(g);if(opt.evenodd)g.clip('evenodd');else g.clip();
  g.fillStyle=GROUT;g.fillRect(-pad,-pad,w+pad*2,h+pad*2);
  tileFill(g,0,0,w,h,tile,colorAt,r,0.75/(U*res));
  g.restore();
  if(!opt.noStroke){g.lineJoin='round';g.strokeStyle=GROUT;g.lineWidth=Math.max(2.4/(U*res),1.6);g.beginPath();shape(g);g.stroke();}
  return {c,w,h,pad};
}
const shRect=(w,h)=>g=>g.rect(0,0,w,h);
const shRound=(w,h,r)=>g=>{g.moveTo(r,0);g.arcTo(w,0,w,h,r);g.arcTo(w,h,0,h,r);g.arcTo(0,h,0,0,r);g.arcTo(0,0,w,0,r);g.closePath();};
const shCirc=R=>g=>{g.moveTo(R*2,R);g.arc(R,R,R,0,TAU);};
const shPoly=pts=>g=>{pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();};

/* ===== 寸法 ===== */
const BW=200,BH=150,SKX=20,SKY=24,CART_H=64,CART_W=250,LID_L=150;
const RAMP_A=Math.asin(CART_H/LID_L),RCOS=Math.cos(RAMP_A),RSIN=Math.sin(RAMP_A);
const DISC_R=44,STAND_W=170,STAND_H=185,LIE_W=210,LIE_H=135,CAR_W=150,CAR_H=66;

/* ===== スプライト ===== */
const S={};
function crate(frame,grainDir){return (x,y,r)=>{
  if(x<frame.l||x>frame.r||y<frame.t||y>frame.b)return r()<.25?sh('yel',r):sh('red',r);
  const q=grainDir?x:y,o=grainDir?y:x;
  const gr=Math.abs(((q+Math.sin(o*.045)*7)%24+24)%24-12);
  if(gr<2.4)return sh('red',r);
  return r()<.07?sh('milk',r):sh('yel',r);
};}
function buildSprites(){
  S.boxFront=makeSpr(BW,BH,shRect(BW,BH),(x,y,r)=>{
    if(Math.abs(x-y*BW/BH)<9||Math.abs((BW-x)-y*BW/BH)<9)return sh('red',r);
    return crate({l:11,r:BW-11,t:11,b:BH-11},false)(x,y,r);},9,11);
  S.boxTop=makeSpr(BW+SKX,SKY,shPoly([[0,SKY],[BW,SKY],[BW+SKX,0],[SKX,0]]),(x,y,r)=>r()<.3?sh('milk',r):sh('yel',r),8,12);
  S.boxSide=makeSpr(SKX,BH+SKY,shPoly([[0,BH+SKY],[SKX,BH],[SKX,0],[0,SKY]]),(x,y,r)=>r()<.7?sh('red',r):sh('yel',r),7,13);
  S.lidPlate=makeSpr(BW,160,shRect(BW,160),(x,y,r)=>{
    if((Math.abs(x-50)<14||Math.abs(x-150)<14)&&Math.abs(y-80)<14)return r()<.5?sh('milk',r):sh('cob',r);
    return crate({l:10,r:BW-10,t:10,b:150},true)(x,y,r);},9,14);
  S.plank=makeSpr(LID_L,20,shRect(LID_L,20),(x,y,r)=>(Math.abs(y-10)<3?sh('red',r):sh('yel',r)),7,15);
  S.stand=makeSpr(STAND_W,STAND_H,shRect(STAND_W,STAND_H),(x,y,r)=>{
    if(y<18)return sh('cob',r);
    return crate({l:10,r:STAND_W-10,t:26,b:STAND_H-10},true)(x,y,r);},9,16);
  S.tunnel=makeSpr(LIE_W,LIE_H,g=>{g.rect(0,0,LIE_W,LIE_H);g.moveTo(32,LIE_H+2);g.lineTo(32,62);g.arc(LIE_W/2,62,LIE_W/2-32,Math.PI,0);g.lineTo(LIE_W-32,LIE_H+2);g.closePath();},(x,y,r)=>{
    const a=Math.atan2(y-62,x-LIE_W/2),d=dist(x,y,LIE_W/2,62);
    if(y<62+4&&d<LIE_W/2-32+16)return ((a*6/Math.PI|0)%2)?sh('cob',r):sh('milk',r);
    return crate({l:10,r:LIE_W-10,t:10,b:LIE_H+20},false)(x,y,r);},9,17,{evenodd:true});
  S.disc=makeSpr(DISC_R*2,DISC_R*2,shCirc(DISC_R),(x,y,r)=>{const d=dist(x,y,DISC_R,DISC_R);
    return d<11?sh('yel',r):d<23?sh('cob',r):d<33?sh('milk',r):sh('red',r);},6.5,18);
  const VR=78;
  S.vanes=makeSpr(VR*2,VR*2,g=>{for(let k=0;k<4;k++){const a=k*TAU/4+.25;g.moveTo(VR,VR);g.ellipse(VR+Math.cos(a)*VR*.52,VR+Math.sin(a)*VR*.52,VR*.5,VR*.24,a,0,TAU);}},
    (x,y,r)=>{const a=(Math.atan2(y-VR,x-VR)-.25+TAU*2)%TAU,k=Math.round(a/(TAU/4))%4,d=dist(x,y,VR,VR);
      if(d>VR*.86)return sh('milk',r);return k%2?sh('cob',r):sh('red',r);},8,19);
  S.stick=makeSpr(22,150,shRound(22,150,9),(x,y,r)=>(((y/19)|0)%2?sh('red',r):sh('yel',r)),7,20);
  S.cloth=makeSpr(96,72,shPoly([[0,4],[24,0],[48,6],[72,0],[96,5],[90,36],[96,68],[70,72],[48,66],[24,72],[2,68],[6,36]]),
    (x,y,r)=>(((x+y*.6)/16|0)%3===0?sh('milk',r):sh('jade',r)),8,21);
  S.car=makeSpr(CAR_W,CAR_H,shPoly([[0,CAR_H],[0,30],[14,16],[52,14],[66,0],[132,0],[150,22],[150,CAR_H]]),(x,y,r)=>{
    if(y>44&&y<54)return sh('red',r);
    if(y<26&&((x>72&&x<100)||(x>106&&x<134)))return sh('milk',r);
    if(y>CAR_H-8)return sh('cob',r);
    return r()<.06?sh('milk',r):sh('cob',r);},8,22);
  S.wmBase=makeSpr(120,56,shPoly([[0,56],[14,8],[106,8],[120,56]]),(x,y,r)=>(y<20?sh('milk',r):(x<20?sh('jade',r):sh('red',r))),8,23);
  S.cup=makeSpr(46,32,g=>{g.moveTo(0,0);g.lineTo(46,0);g.lineTo(40,32);g.lineTo(6,32);g.closePath();},(x,y,r)=>sh('jade',r),7,24);
  S.cartTop=makeSpr(CART_W,28,shRound(CART_W,28,6),(x,y,r)=>(((x/30)|0)%2?sh('red',r):sh('yel',r)),8,25);
  S.wheel=makeSpr(44,44,shCirc(22),(x,y,r)=>{const d=dist(x,y,22,22);return d<7?sh('milk',r):d<14?sh('cob',r):sh('jade',r);},6,26);
  S.hand=makeSpr(70,96,shPoly([[20,96],[18,50],[6,40],[4,28],[16,26],[24,34],[24,6],[32,0],[40,6],[40,30],[54,30],[64,36],[66,62],[58,96]]),
    (x,y,r)=>(y>82?sh('yel',r):sh('milk',r)),7,27);
  S.gate=makeSpr(110,200,g=>{g.rect(0,0,110,200);g.moveTo(22,202);g.lineTo(22,64);g.arc(55,64,33,Math.PI,0);g.lineTo(88,202);g.closePath();},
    (x,y,r)=>{const a=Math.atan2(y-64,x-55);if(y<70)return ((a*5/Math.PI|0)%2)?sh('yel',r):sh('cob',r);return ((y/26|0)%2)?sh('cob',r):sh('milk',r);},9,28,{evenodd:true});
  S.plankS=makeSpr(44,16,shRound(44,16,4),(x,y,r)=>sh('yel',r),7,29);
  S.plankB=makeSpr(44,18,shRound(44,18,4),(x,y,r)=>[sh('red',r),sh('yel',r),sh('jade',r),sh('cob',r),sh('milk',r)][(x/9|0)%5],6,30);
  S.post=makeSpr(16,100,shRect(16,100),(x,y,r)=>sh('cob',r),7,31);
  S.swing=makeSpr(170,150,g=>{g.moveTo(0,150);g.lineTo(70,0);g.lineTo(100,0);g.lineTo(170,150);g.lineTo(148,150);g.lineTo(85,22);g.lineTo(22,150);g.closePath();},(x,y,r)=>sh('red',r),8,32);
  S.slide=makeSpr(190,150,shPoly([[0,150],[0,10],[30,10],[30,40],[190,135],[190,150],[160,150],[34,78],[30,150]]),(x,y,r)=>(x<32?((y/18|0)%2?sh('yel',r):sh('red',r)):sh('jade',r)),8,33);
  S.dome=makeSpr(170,95,g=>{g.moveTo(0,95);g.arc(85,95,85,Math.PI,0);g.closePath();},(x,y,r)=>{const d=dist(x,y,85,95);return ((d/17|0)%2)?sh('cob',r):sh('milk',r);},8,34);
  S.spiral=makeSpr(120,200,shPoly([[60,0],[120,200],[0,200]]),(x,y,r)=>(((y+x*.5)/22|0)%2?sh('red',r):sh('yel',r)),8,35);
  S.flag=makeSpr(70,46,shPoly([[0,0],[70,10],[56,24],[70,40],[0,46]]),(x,y,r)=>sh('red',r),7,36);
  S.tower=makeSpr(90,170,shRect(90,170),(x,y,r)=>(((y/42)|0)%2?sh('yel',r):sh('red',r)),8,37);
  S.parcel=makeSpr(70,56,shRect(70,56),(x,y,r)=>(Math.abs(x-35)<6||Math.abs(y-28)<5?sh('red',r):sh('yel',r)),7,38);
  buildBg();
  const pz=portrait?0.78:L.zp;
  for(const k in S){if(k==='bg'||k==='bgShop')continue;const sp=S[k],c=document.createElement('canvas');c.width=Math.max(1,Math.round(sp.c.width*pz));c.height=Math.max(1,Math.round(sp.c.height*pz));
    const g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(sp.c,0,0,c.width,c.height);sp.lo=c;}
}
/* ===== レイアウト ===== */
const L={};
function computeLayout(){
  const p=portrait;
  L.zp=p?0.5:0.6;L.Wp=VW/L.zp;L.Hp=VH/L.zp;
  L.Ry=L.Hp*0.8;
  L.oy=L.Ry-VH*(p?0.85:0.9);
  L.floorY=L.oy+VH*(p?0.62:0.6);
  L.cartX=p?290:VW*0.42;
  L.wmX=p?100:Math.max(130,VW*0.13);
  L.carX=p?205:VW*0.22;
  L.gateL=56;L.gateR=VW-56;
  L.slotX=[VW+(p?130:120),VW+(p?355:345)];
  L.yardX=L.slotX[0];L.yard2X=L.slotX[1];
  L.hill={x:L.Wp-(p?95:100),y:L.Ry-(p?330:300)};
  L.endR=L.Wp-60;
  L.pgBase=p?L.Ry+170:L.Ry+205;
}
function buildBg(){
  const W=L.Wp,H=L.Hp,k=U*DPR;
  const pz=portrait?0.78:L.zp;let res=Math.min(pz,Math.sqrt(6e6/(W*H*k*k)),4000/(W*k),4000/(H*k));
  const fy=L.floorY,ry=L.Ry,sun={x:VW*0.8,y:L.oy+VH*0.13},r0=rng(99),clouds=[];
  for(let i=0;i<9;i++)clouds.push({x:r0()*W,y:L.oy*0.2+r0()*(fy-L.oy*0.2-160),rx:70+r0()*90,ry:24+r0()*18});
  const trees=[];for(let i=0;i<6;i++)trees.push({x:VW+30+i*(W-VW-260)/5+(r0()-.5)*30,y:fy-150-r0()*40,r:44+r0()*20});
  const bgc=(x,y,r)=>{
    if(y>ry+34){return r()<.06?sh('yel',r):(r()<.05?sh('milk',r):sh('jade',r));}
    if(y>ry-22){if(y<ry-14||y>ry+26)return sh('milk',r);if(Math.abs(y-ry-6)<6&&((x/64|0)%2))return sh('yel',r);return sh('red',r);}
    if(y>fy-4){
      if(x<VW){const u=(x+y)/46,v=(x-y)/46;return (((u|0)+(v|0))%2)?sh('milk',r):(r()<.5?sh('yel',r):sh('milk',r));}
      return r()<.18?sh('milk',r):sh('jade',r);}
    const hd=dist(x,y,L.hill.x+40,L.hill.y+215);
    if(hd<240&&y>L.hill.y-4){if(Math.abs(hd-200)<9||Math.abs(hd-140)<8)return sh('milk',r);return r()<.12?sh('yel',r):PAL.jade[1];}
    for(const t of trees){const td=dist(x,y,t.x,t.y);if(td<t.r)return r()<.15?sh('yel',r):(td<t.r*.6?PAL.jade[1]:sh('jade',r));}
    const hz=fy-40-Math.sin(x/140)*22-Math.sin(x/53)*8;
    if(y>hz)return r()<.3?sh('jade',r):PAL.jade[2];
    const sd=dist(x,y,sun.x,sun.y);
    if(sd<62)return sd<40?sh('yel',r):(r()<.5?sh('yel',r):sh('red',r));
    if(sd<110){const a=Math.atan2(y-sun.y,x-sun.x);if(((a*8/Math.PI)|0)%2===0&&sd<100)return sh('red',r);}
    for(const c of clouds){const dx=(x-c.x)/c.rx,dy=(y-c.y)/c.ry;if(dx*dx+dy*dy<1)return sh('milk',r);}
    return r()<.04?sh('milk',r):sh('cob',r);
  };
  S.bg=makeSpr(W,H,shRect(W,H),bgc,26,7,{res,noStroke:true});
  S.bgShop=makeSpr(VW,VH,shRect(VW,VH),(x,y,r)=>bgc(x,y+L.oy,r),26,8,{noStroke:true});
}

/* ===== 状態 ===== */
const G={phase:'shop',t:0,cam:{z:1,ox:0,oy:0},camA:null,boxes:[],parts:[],slots:[null,null],yard:null,
  bridge:{on:false,t:0,big:false,count:0},pg:[],cycle:0,cycBox:0,lastSide:null,events:[],disc:{},firstTap:false,
  idle:0,demoDone:{},demo:null,hintT:0,held:null,pid:null,saveOk:true,restored:false};
G.cart={x:0,y:0,tx:0,wob:0,spin:0,box:null};
G.wm={x:0,y:0,tx:null,post:false,rotor:false,flag:false,ang:0,spd:0,dir:1,face:1,wob:0,flagPh:0,boostT:0,held:false};
G.car={s:0,x:0,y:0,state:'road',v:0,wheels:0,sail:false,sailPos:0,face:1,wob:0,wrot:0,arrived:null,hop:null,bob:0,lastX:0};
G.wind={dir:1,str:0};
let path={x:[],y:[],len:[],total:1,endR:'G'};
let nextId=1;
const P=[],WIND=[];const PMAX=90,WMAX=34;
function discover(k){if(!G.disc[k]){G.disc[k]=G.t;}}

function newBox(){
  const c=['disc','stick','cloth'];if(Math.random()<.35)c.push(['disc','cloth','stick'][Math.random()*3|0]);
  return {id:nextId++,x:G.cart.x,y:0,vy:0,state:'drop',side:null,orient:'stand',home:'cart',contents:shuffle(c),
    cracks:{top:new Array(9).fill(0),side:new Array(7).fill(0)},crackA:{top:new Array(9).fill(0),side:new Array(7).fill(0)},
    seed:(Math.random()*1e9)|0,lidT:0,lidV:0,squash:0,wob:0,peek:0,flash:[],bounce:0,flip:0,tx:0,ty:0,held:false};
}
function boxBottomOnCart(){return G.cart.y-CART_H;}
function homePos(b){
  if(b.home==='cart')return {x:G.cart.x,y:boxBottomOnCart()};
  if(b.home==='yard')return {x:L.yardX,y:L.floorY};
  if(b.home==='slot0')return {x:L.slotX[0],y:L.Ry};
  if(b.home==='slot1')return {x:L.slotX[1],y:L.Ry};
  return {x:b.x,y:b.y};
}
function crackPath(b,side){
  const r=rng(b.seed+(side==='top'?1:2)),pts=[],n=side==='top'?9:7;
  for(let i=0;i<=n;i++){const f=i/n;
    if(side==='top')pts.push([b.x-88+f*196+(i&&i<n?(r()-.5)*8:0),b.y-BH-12+(i&&i<n?(r()-.5)*8:0)]);
    else pts.push([b.x+BW/2+10+(i&&i<n?(r()-.5)*7:0),b.y-BH-10+f*(BH-2)+(i&&i<n?(r()-.5)*8:0)]);}
  return pts;
}
function rampOf(b){
  if(!b||b.state!=='open'||b.side!=='side'||b.home!=='cart'||b.held)return null;
  const hx=b.x+BW/2,hy=b.y,a=lerp(-Math.PI/2,RAMP_A,clamp(b.lidT,0,1));
  return {hx,hy,fx:hx+LID_L*Math.cos(a),fy:hy+LID_L*Math.sin(a),a,ready:b.lidT>0.98&&Math.abs(b.lidV)<0.5};
}
function cartBox(){return G.cart.box;}
/* ===== 音 ===== */
let AC=null,MASTER=null,NB=null,windG=null,rollG=null,audioWanted=false;
function audioInit(){

/* ===== 道 ===== */
function boxH(b,bridged){if(!b)return 0;return b.orient==='stand'?STAND_H:(bridged?LIE_H:0);}
function boxHW(b){return b.orient==='stand'?STAND_W/2:LIE_W/2;}
function profile(i,x,bridged){const b=G.slots[i];if(!b)return 0;const H=boxH(b,bridged);if(!H)return 0;const hw=boxHW(b),wg=120,d=Math.abs(x-L.slotX[i]);if(d<=hw)return H;if(d<hw+wg)return H*(1-(d-hw)/wg);return 0;}
function hillEnd(){return {x:L.hill.x-14,y:L.hill.y+10};}
function buildPath(){
  const X=[],Y=[];let endR='G';
  if(G.phase==='shop'||G.phase==='toShop'){for(let x=70;x<=VW-70;x+=20){X.push(x);Y.push(L.Ry);}}
  else if(!G.bridge.on){for(let x=70;x<=L.endR;x+=10){X.push(x);Y.push(L.Ry-Math.max(profile(0,x,false),profile(1,x,false)));}endR='R';}
  else{
    const s0=L.slotX[0],s1=L.slotX[1],b0=G.slots[0],b1=G.slots[1],H0=boxH(b0,true),H1=boxH(b1,true),he=hillEnd();
    for(let x=70;x<s0;x+=10){X.push(x);Y.push(L.Ry-profile(0,x,true));}
    const bez=(ax,ay,cx,cy,bx,by)=>{for(let i=0;i<=40;i++){const t=i/40,u=1-t;X.push(u*u*ax+2*u*t*cx+t*t*bx);Y.push(u*u*ay+2*u*t*cy+t*t*by);}};
    if(!G.bridge.big){
      for(let x=s0;x<=s1;x+=10){const f=(x-s0)/(s1-s0);X.push(x);Y.push(L.Ry-lerp(H0,H1,f));}
      const ex=s1+boxHW(b1);X.push(ex);Y.push(L.Ry-H1);
      bez(ex,L.Ry-H1,ex+70,L.Ry-H1-10,he.x,he.y);
    }else{
      X.push(s0);Y.push(L.Ry-H0);

}
function pathAt(s){
  const n=path.x.length;s=clamp(s,0,path.total);let lo=0,hi=n-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(path.len[m]<=s)lo=m;else hi=m;}
  const l=path.len[hi]-path.len[lo]||1,f=(s-path.len[lo])/l;
  return {x:lerp(path.x[lo],path.x[hi],f),y:lerp(path.y[lo],path.y[hi],f),a:Math.atan2(path.y[hi]-path.y[lo],path.x[hi]-path.x[lo])};
}

    boxes:G.boxes.filter(b=>b.state==='open'||b.home!=='cart').map(b=>({o:b.orient,s:b.side||'top',h:b.home||'yard'})),

    car:{w:G.car.wheels,s:G.car.sail?1:0,sp:G.car.sailPos},br:G.bridge.count};
  try{localStorage.setItem(KEY,JSON.stringify(o));G.saveOk=true;}catch(e){G.saveOk=false;}

function validSave(o){

  if(!Array.isArray(o.boxes)||o.boxes.length>4||!Array.isArray(o.pg)||o.pg.length>9)return false;
  const homes={};
  for(const b of o.boxes){if(!b||!['stand','lie'].includes(b.o)||!['top','side'].includes(b.s)||!['yard','slot0','slot1','cart'].includes(b.h))return false;if(b.h!=='cart'){if(homes[b.h])return false;homes[b.h]=1;}}
  for(const t of o.pg)if(!['swing','slide','dome','spiral','flag','tower'].includes(t))return false;
  const w=o.wm,c=o.car;if(!w||!c)return false;

  if(tg==='car'){if(p.type==='disc'){attachWheel(p,'hand');return;}
    const rel=(p.x-c.x)/(CAR_W/2)*c.face;c.sail=true;c.sailPos=rel<-.33?-1:rel>.33?1:0;consume(p);SFX.snap();c.wob=1;sparks(c.x,c.y-90,8);discover('sail');return;}
  if(tg==='flag'){W.flag=true;consume(p);SFX.snap();W.wob=1;discover('flag');return;}
  if(tg==='cup'){p.state='free';boost('hand');p.x-=70;p.y=restY(p.y);p.wob=1;return;}

  p.state='free';p.vy=0;p.wob=1;SFX.kotsu(1.3);
}
function dropCar(){
  const c=G.car,f=footPos();
  if(f&&dist(c.x,c.y,f.x+80,f.y)<hitR(150)){c.state='floor';c.x=f.x+80;c.y=L.floorY;SFX.thud();c.wob=1;discover('carfoot');
    const d=G.parts.find(q=>q.type==='disc'&&q.state==='free'&&dist(q.x,q.y,c.x,c.y)<160);if(d){attachWheel(d,'ramp');}
    else if(c.wheels>0)G.events.push({at:G.t+1.0,fn:carToRoad});return;}

}
function dropBox(h){
  const b=h.box;b.held=false;
  const moved=h.moved,quick=G.t-h.t0<.4;
  if(moved<16&&quick&&h.prev!=='cart'){b.orient=b.orient==='stand'?'lie':'stand';b.flip=1;SFX.thud();dust(b.x,b.y,5);checkBridgeLost();rebuildPathKeepCar();save();return;}
  if(moved<16){b.bounce=1;return;}
  let best=null,bd=1e9;
  for(const hm of ['slot0','slot1','yard']){const tmp={home:hm};const hp=homePos(tmp);const d=dist(b.x,b.y-60,hp.x,hp.y-60);if(d<hitR(190)&&d<bd){bd=d;best=hm;}}
  if(best&&best!==h.prev){
    const occ=occupant(best),prev=h.prev;
    setHome(b,best);
    if(occ&&occ!==b){if(prev&&prev!=='cart')setHome(occ,prev);else{setHome(occ,null);parkBox(occ);}}
    SFX.thud();dust(b.x,b.y,6);b.flip=.6;checkBridgeLost();rebuildPathKeepCar();save();
  }else{b.bounce=.6;SFX.wob();}

}
function onUp(e){
  if(e.pointerId!==G.pid)return;
  const h=G.held;G.held=null;G.pid=null;try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  if(!h)return;
  if(h.kind==='part'){dropPart(h.p);}
  else if(h.kind==='car'){dropCar();}
  else if(h.kind==='box'){dropBox(h);}
  else if(h.kind==='wm'){const W=G.wm;W.held=false;const f=footPos();if(f&&Math.abs(W.x-(f.x+62))<hitR(150)){W.x=f.x+62;discover('wmfoot');}SFX.thud();dust(W.x,W.y,4);}
  else if(h.kind==='rotor'){G.wm.held=false;if(h.moved<8){G.wm.spd+=3;SFX.whoosh(.3);}}
  else if(h.kind==='sail'){const c=G.car;c.sailPos=Math.round(c.sailPos);SFX.snap();c.wob=1;discover('sailpos'+c.sailPos);}
}

function currentTarget(){
  if(G.camA||G.phase==='toPark'||G.phase==='toShop')return null;
  const b=cartBox(),c=G.car,W=G.wm;
  if(b&&b.state==='drop')return null;
  if(b&&b.state==='closed'&&G.phase==='shop')return {k:'crack',box:b,side:G.lastSide==='top'?'side':'top'};
  const fp=G.parts.filter(p=>p.state==='free'||p.state==='lid');const find=t=>fp.find(p=>p.type===t);
  const drag=(o,to)=>({k:'drag',o,to});
  if(!wmBuilt()){const pin=find('pin');if(pin)return drag(pin,standPt());
    if(!W.post){const s=find('stick');if(s)return drag(s,standPt());}
    if(!W.rotor){const d=find('disc');if(d)return drag(d,standPt());}}
  if(c.wheels===0){const r=rampOf(b);if(r&&c.state==='road')return {k:'drag',o:'car',to:{x:r.fx+80,y:L.floorY-40}};const d=find('disc');if(d)return drag(d,carPt());}
  if(!c.sail){const cl=find('cloth');if(cl)return drag(cl,carPt());}
  if(G.phase==='park'&&G.restored&&!cartBox())return {k:'tap',o:'cart'};
  if(G.phase==='park'){
    const fb=G.boxes.find(x=>x.state==='open'&&(x.home==='yard'||x.home==='cart'));const es=[0,1].find(i=>!G.slots[i]);
    if(fb&&es!==undefined)return {k:'drag',o:fb,to:{x:L.slotX[es],y:L.Ry-60}};
    if(G.slots[0]&&G.slots[1]&&!G.bridge.on&&wmBuilt())return {k:'spin'};
    if(!cartBox())return {k:'tap',o:'cart'};
  }
  const r=rampOf(b);if(r&&wmBuilt()){const d=find('disc');if(d)return drag(d,{x:r.hx+20,y:r.hy-DISC_R-10});}
  if(wmBuilt())return {k:'spin'};
  return null;
}
function tgPos(tg){

  if(tg.k==='spin')return rotorC();

  if(tg.o==='car')return {x:G.car.x,y:G.car.y-50};

}

  drawPg();
  drawWm();
  drawCart();
  for(const b of G.boxes){if(b.home==='cart'&&!b.held||b.state!=='open')drawCartBox(b);}
  for(const b of G.boxes){if(b.state==='open'&&(b.home!=='cart'||b.held))drawParkBox(b,0);}
  drawBridge();
  drawCar();
  for(const b of G.boxes){if(b.state==='open'&&(b.home!=='cart'||b.held)&&b.orient==='lie')drawParkBox(b,1);}
  for(const p of G.parts)drawPart(p);
  // wind
  ctx.lineCap='round';
  for(const s of WIND){const a=Math.min(1,s.life*3,(s.max-s.life)*2)*.7;ctx.strokeStyle='rgba(248,242,228,'+a+')';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-Math.sign(s.vx)*s.len,s.y-Math.sin(s.life*4+s.ph)*6);ctx.stroke();
    ctx.strokeStyle='rgba(26,33,49,'+a*.7+')';ctx.lineWidth=1.5;ctx.stroke();}
  for(const q of P){const a=clamp(1-q.life/q.max,0,1);ctx.globalAlpha=a;ctx.fillStyle=q.col;ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.rot);
    if(q.k==='dust'){ctx.beginPath();ctx.arc(0,0,q.sz,0,TAU);ctx.fill();}
    else{const r=rng(q.sd||1),z=q.sz;ctx.beginPath();ctx.moveTo(-z*.5,-z*(.3+r()*.3));ctx.lineTo(z*(.3+r()*.3),-z*.5);ctx.lineTo(z*.5,z*(.2+r()*.3));ctx.lineTo(-z*(.2+r()*.3),z*.5);ctx.closePath();ctx.fill();ctx.strokeStyle=GROUT;ctx.lineWidth=1.5;ctx.stroke();}
    ctx.restore();}
  ctx.globalAlpha=1;
  drawTarget(tg);
  drawDemo();
}
function ring(x,y,R,n){ctx.fillStyle='rgba(255,250,235,'+(.16+.1*Math.sin(G.t*5))+')';ctx.beginPath();ctx.arc(x,y,R,0,TAU);ctx.fill();
  for(let i=0;i<n;i++){const a=G.t*1.2+i*TAU/n,px=x+Math.cos(a)*R,py=y+Math.sin(a)*R;ctx.fillStyle=i%2?PAL.yel[1]:PAL.milk[1];ctx.save();ctx.translate(px,py);ctx.rotate(a);ctx.scale(1.6,1.6);ctx.beginPath();ctx.moveTo(-6,-5);ctx.lineTo(7,-4);ctx.lineTo(5,6);ctx.lineTo(-5,4);ctx.closePath();ctx.fill();ctx.strokeStyle=GROUT;ctx.lineWidth=1.5;ctx.stroke();ctx.restore();}}
function drawTarget(tg){
  if(!tg)return;const pul=1+Math.sin(G.t*5)*.08+G.nudge*.3;
  if(tg.k==='crack'){const pts=crackPath(tg.box,tg.side);ctx.lineCap='round';ctx.strokeStyle='rgba(255,255,255,'+(.35+.3*Math.sin(G.t*6))+')';ctx.lineWidth=10*pul;ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();
    const m=tgPos(tg);ring(m.x,m.y,(tg.side==='top'?60:46)*pul,10);return;}
  const p=tgPos(tg);const R=(tg.k==='spin'?96:tg.k==='tap'?110:tg.o==='car'?95:tg.o&&tg.o.orient!==undefined?110:64)*pul;ring(p.x,p.y,R,12);
  if(tg.k==='drag'&&tg.to){ctx.strokeStyle='rgba(248,242,228,'+(.25+.25*Math.sin(G.t*6+1))+')';ctx.lineWidth=4;ctx.setLineDash([10,12]);ctx.lineDashOffset=-G.t*30;ctx.beginPath();ctx.arc(tg.to.x,tg.to.y,52,0,TAU);ctx.stroke();ctx.setLineDash([]);}
}
function drawDemo(){
  const d=G.demo;if(!d)return;const tg=d.tg;let x,y,press=1;const t=d.t;
  const a=Math.min(1,t*3,(5.2-t)*3);if(a<=0)return;
  if(tg.k==='crack'){const pts=crackPath(tg.box,tg.side),f=.5-.5*Math.cos(t*2.4),n=pts.length-1,u=f*n*.6,i=Math.min(n-1,u|0),e=u-i;x=lerp(pts[i][0],pts[i+1][0],e);y=lerp(pts[i][1],pts[i+1][1],e);}
  else if(tg.k==='spin'){const c=rotorC();x=c.x+Math.cos(t*3)*70;y=c.y+Math.sin(t*3)*70;}
  else if(tg.k==='tap'){x=G.cart.x;y=G.cart.y-40;press=1-Math.max(0,Math.sin(t*6))*.15;}
  else{const p=tgPos(tg),q=tg.to,f=ease(clamp((t%2.6)/1.8,0,1));x=lerp(p.x,q.x,f);y=lerp(p.y,q.y,f);}
  ctx.globalAlpha=a*.92;D(S.hand,x,y,.45,0,0,press,press);ctx.globalAlpha=1;
}
/* ===== 起動・サイズ ===== */
function readSafe(){try{const cs=getComputedStyle(document.getElementById('sa'));SA.t=parseFloat(cs.paddingTop)||0;SA.r=parseFloat(cs.paddingRight)||0;SA.b=parseFloat(cs.paddingBottom)||0;SA.l=parseFloat(cs.paddingLeft)||0;}catch(e){}}
function setSize(){
  readSafe();
  DPR=Math.min(2,DPR_CAP,window.devicePixelRatio||1);SW=Math.max(1,window.innerWidth);SH=Math.max(1,window.innerHeight);
  cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);
  portrait=SH>SW;
  const usableW=SW-SA.l-SA.r,usableH=SH-SA.t-SA.b;
  U=Math.min(usableW,usableH)/700;
  VW=SW/U;VH=SH/U;
}
let sized=false,DPR_CAP=2,slowT=0,fastN=0;
function resize(){
  const old=sized?{Wp:L.Wp,VW,floorY:L.floorY,Ry:L.Ry,tot:path.total}:null;
  setSize();computeLayout();buildSprites();
  G.cart.y=L.floorY;
  if(old){
    const mx=x=>x<old.VW?x/old.VW*VW:VW+(x-old.VW)/(old.Wp-old.VW)*(L.Wp-VW);
    const my=y=>y>=old.Ry-60?L.Ry+(y-old.Ry):L.floorY+(y-old.floorY);
    G.cart.x=G.cart.tx=(G.phase==='park'||G.phase==='toPark')?L.yard2X:L.cartX;
    G.wm.x=clamp(mx(G.wm.x),70,L.Wp-70);G.wm.tx=null;
    for(const p of G.parts){p.x=mx(p.x);p.y=my(p.y);if(p.pop){p.pop.tx=mx(p.pop.tx);p.pop.ty=my(p.pop.ty);p.pop.fx=mx(p.pop.fx);p.pop.fy=my(p.pop.fy);}}
    for(const b of G.boxes){const hp=homePos(b);b.x=hp.x;if(b.state!=='drop')b.y=hp.y;}
    if(G.camA){const c=G.camA;c.to=c.to.z===1?{z:1,ox:0,oy:L.oy}:parkCam(L.slotX[0]);c.from=Object.assign({},c.to);}
    G.cam=(G.phase==='shop'||G.phase==='toShop')?{z:1,ox:0,oy:L.oy}:parkCam(L.slotX[0]);
    const c=G.car,fr=old.tot?c.s/old.tot:0;buildPath();
    if(c.state==='floor'){const f=footPos();if(f){c.x=f.x+80;c.y=L.floorY;}else{c.state='road';}}
    if(c.state==='hop'){c.state='road';}
    if(c.state!=='floor'){c.state=c.state==='held'?'road':c.state;c.s=fr*path.total;const p=pathAt(c.s);c.x=p.x;c.y=p.y;}
    P.length=0;WIND.length=0;
  }
  sized=true;
}
function initFresh(){
  G.phase='shop';G.cam={z:1,ox:0,oy:L.oy};G.cart.x=G.cart.tx=L.cartX;G.cart.y=L.floorY;G.cycBox=1;
  G.wm.x=L.wmX;G.wm.y=L.floorY;
  const b=newBox();b.state='closed';b.y=boxBottomOnCart();b.x=G.cart.x;G.boxes.push(b);G.cart.box=b;
  buildPath();const c=G.car;c.state='road';c.s=projectPt(L.carX,L.Ry);const p=pathAt(c.s);c.x=p.x;c.y=p.y;
}
let raf=0,lastTs=0;
function frame(ts){
  raf=0;if(document.hidden)return;
  const dt=lastTs?Math.min(.05,Math.max(0,(ts-lastTs)/1000)):1/60;lastTs=ts;
  try{update(dt);render();}catch(err){console.warn(err);}
  // 古い端末向け: 重い状態が続けば解像度を少し下げる
  if(dt>1/48){slowT+=dt;}else{slowT=Math.max(0,slowT-dt*.5);}
  if(slowT>3&&DPR>1.2&&!G.held){slowT=0;DPR_CAP=Math.max(1.2,DPR-.4);resize();}
  raf=requestAnimationFrame(frame);
}
function startLoop(){if(!raf&&!document.hidden){lastTs=0;raf=requestAnimationFrame(frame);}}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(raf)cancelAnimationFrame(raf);raf=0;if(G.held)onUp({pointerId:G.pid});if(AC&&AC.state==='running')AC.suspend().catch(()=>{});save();}
  else{if(AC&&audioWanted)AC.resume().catch(()=>{});startLoop();}
});
window.addEventListener('pagehide',save);
let rsT=0;function onResize(){clearTimeout(rsT);rsT=setTimeout(()=>{resize();render();},120);}
window.addEventListener('resize',onResize);window.addEventListener('orientationchange',onResize);

setSize();computeLayout();buildSprites();sized=true;
const sv=loadSave();if(sv){try{applySave(sv);}catch(e){G.boxes=[];G.parts=[];G.slots=[null,null];G.yard=null;G.pg=[];initFresh();}}else initFresh();
render();startLoop();
// テスト用の読み取り口（UIなし）
window.__gf={G,L,get path(){return path;},crackPath,rotorC,cupC,footPos,rampOf,cartBox,sailPt,
  toScreen:(x,y)=>({x:(x-G.cam.ox)*U*G.cam.z,y:(y-G.cam.oy)*U*G.cam.z}),U:()=>U,step:(n)=>{for(let i=0;i<n;i++)update(1/60);render();}};
})();
