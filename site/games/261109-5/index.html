/* ---------------- brush ---------------- */
function brush(c,pts,w,a,seed,o){
  o=o||{};

  for(i=0;i<n;i++){

    var dx=pts[i1][0]-pts[i0][0], dy=pts[i1][1]-pts[i0][1], d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    var t=i/(n-1), pr;

    pr*=1+(hash(seed,i,3)-0.5)*0.3;
    var hw=w*0.5*pr;
    lx.push(pts[i][0]-dy*hw); ly.push(pts[i][1]+dx*hw); rx.push(pts[i][0]+dy*hw); ry.push(pts[i][1]-dx*hw);
  }
  c.beginPath(); c.moveTo(lx[0],ly[0]);
  for(i=1;i<n;i++) c.lineTo(lx[i],ly[i]);
  for(i=n-1;i>=0;i--) c.lineTo(rx[i],ry[i]);

      }

  }
}

/* ---------------- hint ---------------- */
function targetVia(x,y){
  var ch=S.child; if(ch.x===x&&ch.y===y) return null;
  var path=bfsPath(function(a,b){return a===x&&b===y;}); if(!path) return null;
  for(var i=0;i<path.length;i++) if(path[i].kind==='bridge') return {kind:'bridge',m:path[i].m,b:path[i].b,x:path[i].to.x,y:path[i].to.y};
  return {kind:'cell',x:x,y:y};
}
function computeHint(){
  if(S.flip||S.flipPending) return null;
  var E=S.ending;
  if(E){ if(E.phase==='ready'){ var g=mirrorCell(S.mirrors[E.gate]); return targetVia(g.x,g.y); } return null; }
  var goals=[], bm=S.mirrors.filter(function(m){return nb(m)>0;});
  function adjOK(k){ var st=S.stones[k], m=S.mirrors[st.m]; return m.state==='water'&&isAdj(m)&&nb(m)===0; }
  if(bm.length===0){ ['S1','S3','S2'].forEach(function(k){ if(adjOK(k)) goals.push({stone:k}); }); goals.push({edge:1}); }
  else {
    var m=bm[0];

    if(!S.flipCount) goals.push({edge:1});
    ['S2','S3','S1'].forEach(function(k){ if(adjOK(k)) goals.push({stone:k}); });
    goals.push({edge:1});
  }
  for(var i=0;i<goals.length;i++){ var r=resolveGoal(goals[i]); if(r) return r; }
  return null;
}
function resolveGoal(g){
  var ch=S.child, st, i;
  if(g.stone){ st=S.stones[g.stone]; return targetVia(st.x,st.y); }
  if(g.other){
    st=S.stones[g.other]; var want=-st.cls; if(!want) return null;
    var best=null, bl=1e9;
    for(i=0;i<4;i++){
      var nx=st.x+DIRS[i][0], ny=st.y+DIRS[i][1];
      if(!walkable(nx,ny)||blocked(nx,ny,st.x,st.y)) continue;
      if(clsOf(st.x-nx,st.y-ny)!==want) continue;
      if(ch.x===nx&&ch.y===ny) return {kind:'cell',x:st.x,y:st.y};
      var p=bfsPath(function(a,b){return a===nx&&b===ny;}); if(p&&p.length<bl){bl=p.length;best={x:nx,y:ny};}
    }
    return best?targetVia(best.x,best.y):null;
  }

    var cands=[];

      [last+1,last-1].forEach(function(nx){ if(nx>=0&&nx<6&&row[nx]&&S.run.indexOf(nx)<0&&(dir===0||Math.sign(nx-last)===dir)) cands.push(nx); }); }
    if(!cands.length){
      for(x=0;x<6;x++){ if(!row[x]) continue; var okL=(x+2<6&&row[x+1]&&row[x+2]), okR=(x-2>=0&&row[x-1]&&row[x-2]); if(okL||okR) cands.push(x); }
    }

function update(dt){

  for(i=0;i<3;i++){
    var m=S.mirrors[i]; m.ripple=Math.max(0,m.ripple-dt*0.6); m.shimmer=Math.max(0,m.shimmer-dt*0.55); m.viewA=Math.min(1,m.viewA+dt*1.8);
    for(var r in m.bridges){ var b=m.bridges[r]; if(b.grow<1){ b.grow=Math.min(1,b.grow+dt/b.dur); if(Math.random()<0.5){ var cu=bridgeCurve(m,b), tp=cu[Math.floor(b.grow*(cu.length-1))], pp=proj(tp[0],tp[1],tp[2]); if(S.fx.length<90) S.fx.push({k:'drop',x:pp.x,y:pp.y,vx:(Math.random()-0.5)*40,vy:-10+Math.random()*30,life:0,max:0.5,r:1+Math.random()*2}); } if(b.grow>=1) onBridgeDone(m,b);} else b.tail=Math.min(1,b.tail+dt*1.6); }

  updateChild(dt);
  updateEnding(dt);
  // wind

  for(i=S.streaks.length-1;i>=0;i--){ S.streaks[i].t+=dt; if(S.streaks[i].t>S.streaks[i].dur) S.streaks.splice(i,1); }

  S.idle+=dt;
  if(!firstDemoDone && S.idle>4 && !S.anyMove && !S.demo && !S.drag && !S.wipe){ S.demo={t:0}; firstDemoDone=true; }

}

  if(ch.moodT>0){ ch.moodT-=dt; if(ch.moodT<=0) ch.mood='calm'; }
