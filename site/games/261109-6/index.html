<script>
(function () {
'use strict';
var PI = Math.PI, TAU = PI * 2, DEG = PI / 180;
var cv = document.getElementById('c');
var ctx = cv.getContext('2d');

/* ---------------- colours (clay) ---------------- */
var COL = {
  wood:  ['#9a4a2e', '#62291a', '#c0704f'],
  sand:  ['#c39a40', '#86621f', '#e0bf6c'],
  water: ['#e3dcc8', '#8f9483', '#faf6ea'],
  leaf:  ['#8bb04a', '#56772a', '#b2d06e'],
  road:  ['#6f5b43', '#463826', '#8b7658'],
  floor: ['#8d7653', '#5b4932', '#ad966f'],
  floorS:['#b39a6c', '#76603e', '#d6be8c'],
  face:  ['#b29a70', '#7b6545', '#d2bd92'],
  milk:  ['#ece4cf', '#a59d86', '#fffbf0'],
  rust:  ['#8f3f27', '#5a2415', '#b5603f'],
  ochre: ['#c08f36', '#80601f', '#dfb763'],
  pit:   '#1a140d'
};
var MATS = ['wood', 'sand', 'water'];
var TEAL = '#4f7a72';

/* ---------------- helpers ---------------- */
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
var rnd = Math.random;
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function hexA(hex, a) { var n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }

  var r = mulberry(seed * 7919 + 13), p = [], ph = r() * TAU;
  for (var i = 0; i < n; i++) {

    p.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);

}
function rectPts(x, y, w, h, seed, amp) {
  var r = mulberry(seed * 31 + 7), p = [], i;
  var n = Math.max(4, Math.round(w / 16)), m = Math.max(3, Math.round(h / 16));
  function j() { return (r() - 0.5) * amp; }
  for (i = 0; i < n; i++) p.push([x + w * i / n, y + j()]);
  for (i = 0; i < m; i++) p.push([x + w + j(), y + h * i / m]);

}

  c.beginPath();
  c.moveTo((p[n - 1][0] + p[0][0]) / 2, (p[n - 1][1] + p[0][1]) / 2);
  for (var i = 0; i < n; i++) { a = p[i]; b = p[(i + 1) % n]; c.quadraticCurveTo(a[0], a[1], (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); }

  var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (var i = 0; i < p.length; i++) { var q = p[i]; if (q[0] < x0) x0 = q[0]; if (q[0] > x1) x1 = q[0]; if (q[1] < y0) y0 = q[1]; if (q[1] > y1) y1 = q[1]; }

/* clay fill: contact shadow + lit gradient + soft dark rim */
function clay(c, p, col, sh, flat) {
  var b = bbox(p), cx = (b[0] + b[2]) / 2, cy = (b[1] + b[3]) / 2, rad = Math.max(b[2] - b[0], b[3] - b[1]) / 2 + 0.5;
  if (sh) { c.save(); c.translate(sh * 0.35, sh); trace(c, p); c.fillStyle = 'rgba(6,16,10,0.34)'; c.fill(); c.restore(); }
  trace(c, p);

    g.addColorStop(0, col[2]); g.addColorStop(0.5, col[0]); g.addColorStop(1, col[1]);

  var a0 = q() * TAU;

    c.beginPath();

}
function leafPath(c, len, wid) {

  c.bezierCurveTo(-len * 0.2, -wid * 0.95, len * 0.25, -wid * 0.8, len / 2, 0);
  c.bezierCurveTo(len * 0.22, wid * 0.85, -len * 0.25, wid * 0.9, -len / 2, 0);
  c.closePath();

function makeCv(w, h) {
  var k = document.createElement('canvas');
  k.width = Math.max(1, Math.ceil(w * DPR)); k.height = Math.max(1, Math.ceil(h * DPR));
  var c = k.getContext('2d'); c.setTransform(DPR, 0, 0, DPR, 0, 0);
  return k;
}

/* ---------------- audio (Web Audio synthesis) ---------------- */

    var comp = AC.createDynamicsCompressor();

    OUT.connect(comp); comp.connect(AC.destination);

    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    var s = AC.createBufferSource(); s.buffer = AC.createBuffer(1, 1, 22050); s.connect(AC.destination); s.start(0);

function noise(dur, vol, ft, freq, Q, at) {
  if (!aok()) return;
  var t = AC.currentTime + (at || 0);
  var s = AC.createBufferSource(); s.buffer = NB;
  var f = AC.createBiquadFilter(); f.type = ft; f.frequency.value = freq; f.Q.value = Q || 1;
  var g = AC.createGain();

  g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

var SND = {
  wood: function (p, v) { p = p || 1; v = v || 1; tone('triangle', 1250 * p, 820 * p, 0.06, 0.45 * v); tone('sine', 560 * p, 430 * p, 0.11, 0.35 * v); noise(0.025, 0.28 * v, 'bandpass', 2600 * p, 3); },
  sand: function (p, v) { p = p || 1; v = v || 1; for (var k = 0; k < 7; k++) noise(0.022, (0.08 + Math.random() * 0.09) * v, 'highpass', 3400 * p, 0.7, k * 0.017 + Math.random() * 0.006); noise(0.16, 0.1 * v, 'bandpass', 5200 * p, 0.8); },
  water: function (p, v) { p = p || 1; v = v || 1; tone('sine', 330 * p, 1250 * p, 0.09, 0.42 * v); tone('sine', 820 * p, 1700 * p, 0.06, 0.2 * v, 0.05); noise(0.13, 0.12 * v, 'lowpass', 1300, 1); },
  plain: function (p, v) { p = p || 1; v = v || 1; tone('sine', 150 * p, 85 * p, 0.12, 0.32 * v); noise(0.05, 0.06 * v, 'lowpass', 700, 1); },
  clack: function () { noise(0.03, 0.3, 'bandpass', 1700, 4); tone('square', 320, 250, 0.03, 0.06); tone('triangle', 190, 150, 0.07, 0.25, 0.035); noise(0.03, 0.18, 'bandpass', 1200, 4, 0.035); },
  tick: function (sp) { var f = 520 + sp * 760; tone('triangle', f, f * 0.9, 0.025, 0.07); },
  pop: function () { tone('sine', 280, 900, 0.1, 0.26); tone('sine', 900, 600, 0.06, 0.08, 0.08); },
  press: function () { tone('sine', 210, 110, 0.11, 0.3); noise(0.06, 0.07, 'lowpass', 500, 1); },
  squish: function () { tone('sine', 420, 110, 0.28, 0.24); noise(0.2, 0.08, 'lowpass', 600, 1); },
  dent: function () { tone('sine', 240, 170, 0.08, 0.2); },
  chime: function () { var n = [784, 988, 1175, 1568]; for (var i = 0; i < 4; i++) { tone('sine', n[i], n[i], 0.6, 0.16, i * 0.09); tone('triangle', n[i] * 2, n[i] * 2, 0.25, 0.04, i * 0.09); } },
  creak: function () { tone('sawtooth', 85, 140, 0.45, 0.05); tone('sine', 120, 90, 0.4, 0.18, 0.2); noise(0.04, 0.2, 'bandpass', 900, 3, 0.62); tone('triangle', 160, 120, 0.12, 0.25, 0.62); },
  close: function () { tone('sine', 140, 220, 0.25, 0.15); noise(0.04, 0.22, 'bandpass', 1100, 3, 0.45); tone('triangle', 200, 150, 0.1, 0.25, 0.45); },
  bell: function (xn) { var semi = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21][clamp(Math.round(xn * 9), 0, 9)]; var f = 392 * Math.pow(2, semi / 12); tone('sine', f, f, 0.7, 0.16); tone('sine', f * 2.01, f * 2.01, 0.3, 0.05); },

function matSound(m, p, v) { (SND[m] || SND.plain)(p, v); }

/* ---------------- layout ---------------- */
var W = 0, H = 0, DPR = 1, L = {};
var bgCv = null, ringCv = null, faceCv = null;
function readSafe() {
  var e = document.getElementById('sa'), s = getComputedStyle(e);
  return { t: parseFloat(s.paddingTop) || 0, r: parseFloat(s.paddingRight) || 0, b: parseFloat(s.paddingBottom) || 0, l: parseFloat(s.paddingLeft) || 0 };
}
function layout() {

  DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  var sa = readSafe();
  var R = Math.min(W * 0.40, H * 0.25);
  var cx = W / 2, cy = H - R - Math.max(H * 0.05, sa.b + 16);
  var rd = Math.max(15, H * 0.04);
  var roadY = Math.min(H * 0.36, cy - R - Math.max(H * 0.12, rd * 3.7));
  var x0 = Math.max(sa.l + 8, W * 0.03), xR = W - Math.max(sa.r + 8, W * 0.03);
  var stride = (xR - x0) / 16;
  var dh = Math.min(H * 0.13, stride * 4.8);
  roadY = Math.max(roadY, sa.t + H * 0.04 + dh * 1.25);
  L = { W: W, H: H, R: R, cx: cx, cy: cy, rd: rd, roadY: roadY, x0: x0, xR: xR, stride: stride, dh: dh, sa: sa };
  L.ledgeY = roadY + rd * 1.62;
  L.hr = Math.max(R * 0.165, 24);
  L.pStart = (-dh * 0.45 - x0) / stride - 0.5;
  L.pEnd = (W + dh * 0.45 - x0) / stride - 0.5;
  L.drumY = roadY; L.rDr = rd * 0.86;
  L.boardDrop = rd * 2.15;

  L.chL = chute(-1); L.chR = chute(1);

function stepX(i) { return L.x0 + (i + 0.5) * L.stride; }

  var E = side < 0 ? L.exL : L.exR;
  var lsx = side < 0 ? L.x0 + L.stride * 0.35 : L.xR - L.stride * 0.35;
  var dx = Math.abs(E[0] - lsx);
  var P0 = E, P1 = [E[0] + side * Math.min(L.R * 0.22, dx * 0.6 + 6), E[1] - L.R * 0.05];
  var P2 = [lsx, L.ledgeY + (E[1] - L.ledgeY) * 0.5], P3 = [lsx, L.ledgeY];

    var t = i / 18, u = 1 - t;
    pts.push([u * u * u * P0[0] + 3 * u * u * t * P1[0] + 3 * u * t * t * P2[0] + t * t * t * P3[0],

function floorRect(f) { var s = L.stride; return { x: stepX(1 + 5 * f) - s / 2, y: L.roadY - L.rd, w: s * 4, h: L.rd * 2 }; }

/* ---------------- prerender static clay ---------------- */
function prerender() {

  g.addColorStop(0, '#152a1e'); g.addColorStop(0.45, '#1e3a2a'); g.addColorStop(1, '#1a3325');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  for (i = 0; i < 26; i++) {
    var bx = q() * W, by = q() * H, br = 20 + q() * Math.min(W, H) * 0.12;
    trace(c, blobPts(bx, by, br, br * (0.6 + q() * 0.4), 100 + i, 0.15, 14));
    c.fillStyle = q() < 0.5 ? 'rgba(48,82,58,0.22)' : 'rgba(10,24,16,0.25)'; c.fill();
  }
  for (i = 0; i < 34; i++) fingerprint(c, q() * W, q() * H, 10 + q() * 18, 200 + i, q() < 0.5 ? '#3f6a4c' : '#0e2116', 0.22);

  var wallTop = L.roadY - L.dh * 1.5, wallH = L.dh * 1.5 - rd * 0.6;
  clay(c, rectPts(L.x0 - 6, wallTop, L.xR - L.x0 + 12, wallH, 11, 7), ['#284a35', '#183224', '#33583f'], 6);
  c.save(); c.strokeStyle = 'rgba(12,28,18,0.45)'; c.lineWidth = 2;
  for (i = 1; i < 6; i++) { var sx = L.x0 + (L.xR - L.x0) * i / 6 + (q() - 0.5) * 10; c.beginPath(); c.moveTo(sx, wallTop + 4); c.quadraticCurveTo(sx + (q() - 0.5) * 12, wallTop + wallH / 2, sx + (q() - 0.5) * 6, wallTop + wallH - 4); c.stroke(); }
  c.restore();

  for (i = 0; i < 7; i++) {
    var lx = L.x0 + (L.xR - L.x0) * (i + 0.5) / 7, ly = wallTop + 2;
    c.save(); c.translate(lx, ly); c.rotate(-0.4 + q() * 0.8 - PI / 2 * 0.2);

    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (k = 1; k < pts.length; k++) c.lineTo(pts[k][0], pts[k][1]);

    c.strokeStyle = COL.ochre[0]; c.lineWidth = rd * 0.42; c.stroke();
    c.strokeStyle = '#6f531c'; c.lineWidth = rd * 0.18; c.stroke();
    c.restore();

  gutter(L.chL); gutter(L.chR);
  gutter([[L.x0 + L.stride * 0.35, L.ledgeY], [L.xR - L.stride * 0.35, L.ledgeY]]);
  // disc shadow
  c.save(); c.beginPath(); c.ellipse(L.cx + R * 0.04, L.cy + R * 0.16, R * 1.06, R * 0.98, 0, 0, TAU); c.fillStyle = 'rgba(5,14,8,0.42)'; c.fill(); c.restore();
  // bottom clay tufts (decor)
  for (i = 0; i < 6; i++) {
    var tx = (i < 3 ? W * 0.02 + i * W * 0.04 : W * 0.86 + (i - 3) * W * 0.045), ty = H - L.sa.b - 6;
    c.save(); c.translate(tx, ty); c.rotate(-PI / 2 + (i - 2.5) * 0.12);
    leafPath(c, Math.min(W, H) * 0.09, Math.min(W, H) * 0.025); c.fillStyle = '#3f6229'; c.fill(); c.strokeStyle = '#22381a'; c.lineWidth = 1.2; c.stroke(); c.restore();
  }

function drawWings() {

    if (k) pts = [[x0, 0], [x0 + w, 0], [x0 + w, L.roadY + L.rd * 1.6], [x0 - 2, L.roadY + L.rd * 1.4], [x0 + sway, L.roadY * 0.5]];

  }
}
function drawParent() {
  var R = L.R, x = L.cx, y = L.cy, b = S.parentBulge, sway = Math.sin(S.t * 1.6) * R * 0.015;

/* sprout: stem + one big leaf + bud. baby seeds share the exact form. */
function drawSprout(x, y, h, leafCol, rot, twin, tt, leafCol2) {

  ctx.strokeStyle = COL.leaf[1]; ctx.lineWidth = Math.max(2, h * 0.11);

  ctx.strokeStyle = COL.leaf[0]; ctx.lineWidth = Math.max(1.2, h * 0.06); ctx.stroke();
  var w = Math.sin((tt || 0) * 2) * 0.06;
  ctx.save(); ctx.translate(h * 0.04, -h * 0.5); ctx.rotate(-0.5 + w);
  ctx.translate(h * 0.32, 0); leafPath(ctx, h * 0.66, h * 0.26);

  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = leafCol[1]; ctx.lineWidth = Math.max(1, h * 0.03); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-h * 0.3, 0); ctx.lineTo(h * 0.28, 0); ctx.strokeStyle = hexA(leafCol[1], 0.8); ctx.stroke();

    ctx.restore();

  ctx.beginPath(); ctx.arc(0, -h * 0.88, h * 0.1, 0, TAU);
  ctx.fillStyle = COL.leaf[2]; ctx.fill(); ctx.strokeStyle = COL.leaf[1]; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}
function drawSeed(sd) {
  var h = L.R * 0.36 * 0.42;
  h = Math.max(h, L.rd * 0.9);
  var col = COL[sd.mats[0]];
  if (sd.g < 1) {
    var g = sd.g, x = L.cx, y = L.cy - L.R * 0.3;
    var sy = easeOutBack(g), sx = 0.5 + 0.5 * g;
    ctx.save(); ctx.translate(x, y); ctx.scale(sx * Math.max(0.05, sy), Math.max(0.05, sy) * (1 + (1 - g) * 0.4)); ctx.translate(-x, -y);
    seedBody(x, y, h, sd, col);
    ctx.restore();
    return;
  }
  ctx.save(); ctx.translate(sd.x, sd.y); ctx.rotate(sd.rot); ctx.translate(-sd.x, -sd.y);
  seedBody(sd.x, sd.y, h, sd, col);
  ctx.restore();
}
function seedBody(x, y, h, sd, col) {
  ctx.beginPath(); ctx.ellipse(x, y + h * 0.12, h * 0.32, h * 0.1, 0, 0, TAU); ctx.fillStyle = 'rgba(10,8,4,0.25)'; ctx.fill();

  drawSprout(x, y - h * 0.1, h, col, 0, sd.twin, S.t + x * 0.01, sd.mats[1] ? COL[sd.mats[1]] : null);

function drawDisc(tg) {
  var R = L.R, cx = L.cx, cy = L.cy, fl = S.flex;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1 + fl * 0.022, 1 - fl * 0.04);
  // thickness
  ctx.beginPath(); ctx.ellipse(0, R * 0.075, R * 1.0, R * 0.99, 0, 0, TAU); ctx.fillStyle = '#4a2214'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, R * 0.04, R * 1.0, R * 0.99, 0, 0, PI); ctx.strokeStyle = 'rgba(200,120,80,0.3)'; ctx.lineWidth = 2; ctx.stroke();
  var rs = R * 2.3;
  ctx.drawImage(ringCv, -rs / 2, -rs / 2, rs, rs);
  // current section shimmer at the handle
  var sec = sectorOf(S.discA), a0 = SEC_BASE + sec * SEC_W;
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, a0, a0 + SEC_W); ctx.arc(0, 0, R * 0.72, a0 + SEC_W, a0, true); ctx.closePath();
  ctx.fillStyle = 'rgba(255,240,200,' + (0.1 + S.bump * 0.25) + ')'; ctx.fill(); ctx.restore();
  ctx.save(); ctx.rotate(S.discA);
  var fsz = R * 0.72 * 2 + 4; ctx.drawImage(faceCv, -fsz / 2, -fsz / 2, fsz, fsz);
  ctx.restore();
  if (S.dent && !S.dent.onH) {
    var da = S.discA - S.dent.a, c = Math.cos(da), s = Math.sin(da);
    var dx = S.dent.wx * c - S.dent.wy * s, dy = S.dent.wx * s + S.dent.wy * c;
    ctx.beginPath(); ctx.ellipse(dx, dy, R * 0.09, R * 0.065, 0, 0, TAU); ctx.fillStyle = 'rgba(60,40,20,' + (0.4 * S.dent.amt) + ')'; ctx.fill();
  }
  // arm + handle
  var lean = clamp(S.ptrA - S.discA, -0.3, 0.3) * 0.7;
  var ha = S.discA + lean, hr = L.hr;
  var hx = Math.cos(ha) * R * 0.86, hy = Math.sin(ha) * R * 0.86;
  var mx = Math.cos(S.discA) * R * 0.45, my = Math.sin(S.discA) * R * 0.45;
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(20,10,5,0.35)'; ctx.lineWidth = R * 0.13;
  ctx.beginPath(); ctx.moveTo(0, R * 0.03); ctx.quadraticCurveTo(mx, my + R * 0.03, hx, hy + R * 0.03); ctx.stroke();
  ctx.strokeStyle = COL.rust[1]; ctx.lineWidth = R * 0.12;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(mx, my, hx, hy); ctx.stroke();
  ctx.strokeStyle = COL.rust[0]; ctx.lineWidth = R * 0.08; ctx.stroke();
  ctx.strokeStyle = 'rgba(230,150,110,0.35)'; ctx.lineWidth = R * 0.025; ctx.stroke();
  if (tg && tg.k === 'handle') {
    var pu = pulse();

  }
  var press = S.dent && S.dent.onH ? S.dent.amt : 0;
  var bounce = (tg && tg.k === 'handle' && !S.drag) ? Math.abs(Math.sin(S.t * 4.2)) * hr * (S.idle > 7 ? 0.22 : 0.12) : 0;
  ctx.save(); ctx.translate(hx, hy - bounce);
  ctx.scale(1 + press * 0.1 + S.bump * 0.06, 1 - press * 0.16 - S.bump * 0.05);
  clay(ctx, blobPts(0, 0, hr, hr * 0.96, 701, 0.06, 18), COL.milk, hr * 0.28);
  ctx.beginPath(); ctx.arc(0, 0, hr * 0.55, 0, TAU); ctx.strokeStyle = 'rgba(150,110,80,0.35)'; ctx.lineWidth = 2; ctx.stroke();
  fingerprint(ctx, -hr * 0.1, -hr * 0.05, hr * 0.42, 702, '#9e8f74', 0.45);
  if (press > 0) {
    ctx.beginPath(); ctx.ellipse(clamp(S.dent.lx, -hr * 0.5, hr * 0.5), clamp(S.dent.ly, -hr * 0.5, hr * 0.5), hr * 0.42, hr * 0.32, 0, 0, TAU);

    ctx.beginPath(); ctx.ellipse(clamp(S.dent.lx, -hr * 0.5, hr * 0.5), clamp(S.dent.ly, -hr * 0.5, hr * 0.5) + hr * 0.08, hr * 0.38, hr * 0.26, 0, 0.2, PI - 0.2);
    ctx.strokeStyle = 'rgba(255,250,235,' + (0.7 * press) + ')'; ctx.lineWidth = 2; ctx.stroke();

function drawHand() {

function drawParticles() {

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  drawBelt();
  if (S.mode === 'stage') drawDoll(dollX(), L.roadY, S.doll.p, true, false);
  drawWings();
  if (S.mode !== 'stage') drawDoll(peekX(), L.roadY, 0, false, true);

/* ---------------- loop & lifecycle ---------------- */
var raf = 0, last = 0, running = false;
function frame(now) {
  raf = requestAnimationFrame(frame);
  var dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0.016;
  if (dt > 0.05) dt = 0.05;
  try { update(dt); draw(); } catch (e) { if (window.console) console.error(e); cancelAnimationFrame(raf); running = false; }

function stop() { running = false; cancelAnimationFrame(raf); }
document.addEventListener('visibilitychange', function () {

var rzT = 0;

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);

layout();
resetState();
start();
window.__nae = { S: function () { return S; }, L: function () { return L; }, spawnSeed: spawnSeed, tapFloor: tapFloor, getTarget: getTarget };
})();
