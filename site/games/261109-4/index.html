<body>
<canvas id="c"></canvas>
<div id="sa"></div>
<script>
(function(){
'use strict';
/* ====== 基本 ====== */
var cv=document.getElementById('c'), ctx=cv.getContext('2d'), saEl=document.getElementById('sa');
var COL={bg:'#0b1030',ind:'#1d2a5e',red:'#e8452c',gold:'#f4b53a',teal:'#1e9e93',tealD:'#12615e',wht:'#f7f0e1'};
var PI=Math.PI, TAU=PI*2;
function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(x,a,b){return x<a?a:(x>b?b:x);}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function eio(t){t=clamp(t,0,1);return t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;}
function gauss(x,s){return Math.exp(-(x*x)/(2*s*s));}

var N=60,E0=2,E1=57,HMAX=6,HHILL=1.6,NP=7,PW=8,M2=16,SLOPE=0.9,STH=1.45;
var W=1,H=1,DPR=1,S=300,hg=186,hu=10,ch=40,cw=5,cw2=10,floorY=500,cx0=0,cx1=0,vWalk=30,gap=30,uB=240,vB=70;
var SA={l:0,r:0,t:0,b:0}, AREA={l:0,r:1,t:0,b:1};
var h=new Float32Array(N), d=new Float32Array(N), dv=new Float32Array(N), disp=new Float32Array(N);
var wv=new Float32Array(N), wvPrev=new Float32Array(N), bob=new Float32Array(N), brv=new Float32Array(N), brb=new Float32Array(N);
var h2=new Float32Array(M2), h2raw=new Float32Array(M2);
var theta=0, WS={cx:0,cy:0,co:1,si:0};
var time=0, hills=[], valleys=[], dentCol=13, bgPulse=0, fps=60, fpsAcc=0, fpsN=0;
var flags={}, LOG=[];
function logEv(k){ if(!flags[k]){ flags[k]=true; LOG.push([Math.round(time*10)/10,k]); } }

/* ====== 寝息 ====== */
var BR={T:rnd(4.6,6.4),ph:rnd(0,TAU),base:0.3,boost:0,psi:rnd(0,TAU),prof:new Float32Array(N)};
function breathInit(){ for(var i=0;i<N;i++) BR.prof[i]=Math.sin(i/N*TAU*1.3+BR.psi); }

/* ====== 地形 ====== */
function initTerrain(){
  for(var i=0;i<N;i++){ h[i]=rnd(-0.06,0.1); d[i]=0; dv[i]=0; }
  h[0]=1.1;h[1]=0.55;h[N-2]=0.55;h[N-1]=1.1;
  dentCol=12+Math.floor(Math.random()*4);
  for(var j=E0;j<=E1;j++) h[j]-=0.9*gauss(j-dentCol,1.2);
  for(var k=0;k<M2;k++){ h2raw[k]=0.3+0.55*Math.max(0,Math.sin(k*1.9+rnd(0,1.5)))+(k%4===1?0.45:0); h2[k]=h2raw[k]; }
}
function sampleArr(a,u){ var f=u/cw-0.5; if(f<0)f=0; if(f>N-1)f=N-1; var i=f|0,t=f-i,j=i+1<N?i+1:i; return a[i]+(a[j]-a[i])*t; }
function hAt(u){return sampleArr(h,u);}
function gAt(u){return sampleArr(disp,u);}
function h2At(a){ var f=a/cw2-0.5; if(f<0)f=0; if(f>M2-1)f=M2-1; var i=f|0,t=f-i,j=i+1<M2?i+1:i; return h2[i]+(h2[j]-h2[i])*t; }
function computeHills(arr){
  var out=[],i=E0;
  while(i<=E1){
    if(arr[i]>=HHILL){ var s=i,c=i,m=arr[i]; while(i<=E1&&arr[i]>=HHILL){ if(arr[i]>m){m=arr[i];c=i;} i++; } out.push({s:s,e:i-1,c:c,ch:m}); }
    else i++;
  }
  return out;
}
function computeValleys(hl){
  var out=[];
  for(var k=0;k<hl.length-1;k++){
    var A=hl[k],B=hl[k+1],s=A.e+1,e=B.s-1,w=e-s+1;
    if(w<3||w>22) continue;
    var mn=99; for(var j=s;j<=e;j++) mn=Math.min(mn,h[j]);
    if(mn<=Math.min(A.ch,B.ch)-0.9) out.push({s:s,e:e,w:w,mn:mn,taken:false});
  }
  return out;
}
function relax(skip){
  for(var pass=0;pass<2;pass++){
    for(var j=E0-1;j<=E1;j++){
      var a=h[j],b=h[j+1],df=a-b;
      if(Math.abs(df)>SLOPE){
        var m=(Math.abs(df)-SLOPE)*0.25, hi=df>0?j:j+1, lo=df>0?j+1:j;
        if(hi>=E0&&hi<=E1) h[hi]-=m;
        if(lo>=E0&&lo<=E1&&lo!==skip) h[lo]+=m;
      }
    }
  }
}
/* こすって育てる */
function rub(u,du){
  if(!(du>0)) return 0;
  var fc=u/cw-0.5, ci=Math.round(fc), hl=computeHills(h), shift=-1;
  for(var k=0;k<hl.length;k++){
    var A=hl[k],B;
    if(ci>=A.s-4&&ci<A.c){ B=hl[k+1]; if(B&&B.s-A.e-1>=1&&B.s-A.e-1<=22) shift=A.e; }
    else if(ci<=A.e+4&&ci>A.c){ B=hl[k-1]; if(B&&A.s-B.e-1>=1&&A.s-B.e-1<=22) shift=A.s; }
  }
  var tot=0;
  for(var j=ci-4;j<=ci+4;j++){
    if(j<E0||j>E1||j===shift) continue;
    var g=gauss(j-fc,1.6), nh=Math.min(HMAX,h[j]+du*g);
    tot+=nh-h[j]; h[j]=nh;
  }
  if(shift>=0){ h[shift]=Math.max(-0.3,h[shift]-du*0.8); d[shift]-=du*0.3; }
  relax(shift);
  if(!rolled){
    for(var q=0;q<benches.length;q++){
      var b=benches[q];
      if(b.st==='open'&&b.sitters.length>0&&!b.stoolDone&&b.build<0&&stools.length<2){
        if((ci>=b.cL-7&&ci<b.cL)||(ci>b.cR&&ci<=b.cR+7)){ b.nearRub+=du; b.side=ci<b.cL?-1:1; if(b.nearRub>2.0){ b.build=0; } }
      }
    }
  }
  if(tot>0.01) logEv('grow');
  return tot;
}

/* ====== 配置 ====== */
function readSafe(){
  var cs=getComputedStyle(saEl);
  SA.t=parseFloat(cs.paddingTop)||0; SA.r=parseFloat(cs.paddingRight)||0;
  SA.b=parseFloat(cs.paddingBottom)||0; SA.l=parseFloat(cs.paddingLeft)||0;
}
var bgC=null;
function layout(){
  var oldS=S, oldHg=hg;
  W=Math.max(1,window.innerWidth); H=Math.max(1,window.innerHeight);
  DPR=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  readSafe();
  AREA.l=SA.l; AREA.r=W-SA.r; AREA.t=SA.t; AREA.b=H-SA.b;
  var aw=AREA.r-AREA.l, ah=AREA.b-AREA.t, land=aw>ah*1.05;
  S=Math.min(aw*0.9,ah*0.62); hg=S*0.62; hu=S*0.032; ch=S*0.13; cw=S/N; cw2=hg/M2;
  floorY=AREA.t+ah*(land?0.95:0.80);
  cx0=AREA.l+aw/2;
  var need=hg/2+(HMAX+1.5)*hu+ch*0.95;
  cx1=Math.min(AREA.l+aw/2-S*0.22, AREA.r-8-need); cx1=Math.max(cx1,AREA.l+hg/2+4);
  vWalk=S/11; gap=ch*0.72; uB=S*0.8; vB=(HMAX+1.2)*hu;
  if(oldS>0&&inited){ rescale(S/oldS, hg/oldHg); }
  makeBg();
}
/* 変換 */
function wsSet(th){
  var r=clamp(Math.abs(th)/(PI/2),0,1);
  WS.cx=lerp(cx0,cx1,ease(r)); WS.co=Math.cos(th); WS.si=Math.sin(th);
  WS.cy=floorY-(S/2*Math.abs(WS.si)+hg/2*Math.abs(WS.co));
}
function toScr(lx,ly){ return [WS.cx+lx*WS.co-ly*WS.si, WS.cy+lx*WS.si+ly*WS.co]; }
function toLoc(x,y){ var dx=x-WS.cx,dy=y-WS.cy; return [dx*WS.co+dy*WS.si, -dx*WS.si+dy*WS.co]; }
function roadToScr(u,v){ return toScr(u-S/2,-hg/2-v); }
function scrToRoad(x,y){ var l=toLoc(x,y); return [l[0]+S/2,-hg/2-l[1]]; }
function atTheta(th,fn){ var a=WS.cx,b=WS.cy,c=WS.co,e=WS.si; wsSet(th); var r=fn(); WS.cx=a;WS.cy=b;WS.co=c;WS.si=e; return r; }
function topPt(a){ return toScr(-S/2-h2At(a)*hu, hg/2-a); }
function surfV(u){ return gAt(u)*hu; }

/* ====== 背景 ====== */
function makeBg(){
  var q=Math.min(DPR,1.5)*0.75, bw=Math.ceil(W*1.2*q), bh=Math.ceil(H*1.2*q);
  bgC=document.createElement('canvas'); bgC.width=bw; bgC.height=bh;
  var g=bgC.getContext('2d'); g.fillStyle=COL.bg; g.fillRect(0,0,bw,bh);
  g.translate(bw/2,bh/2);
  var R=Math.hypot(bw,bh)/2*0.92, wd=PI/8;
  var sh=[
    [COL.ind,[[0.2,0],[0.42,0],[0.33,0.36]]],
    [COL.tealD,[[0.44,0],[0.58,0.3],[0.72,0]]],
    [COL.ind,[[0.5,0.39],[0.66,0.39],[0.58,0.18]]],
    [COL.red,[[0.66,0.39],[0.84,0.39],[0.76,0.27]]],
    [COL.wht,[[0.37,0.39],[0.47,0.39],[0.44,0.33]]],
    [COL.gold,[[0.84,0],[0.9,0.07],[0.96,0]]],
    [COL.teal,[[0.95,0.39],[1.18,0.39],[1.08,0.17]]],
    [COL.ind,[[0.98,0],[1.32,0],[1.2,0.28]]],
    [COL.tealD,[[0.76,0.04],[0.86,0.2],[0.8,0.3]]]
  ];
  for(var j=0;j<8;j++){
    for(var m=0;m<2;m++){
      g.save(); g.rotate(j*2*wd); if(m) g.scale(1,-1);
      for(var s=0;s<sh.length;s++){
        g.fillStyle=sh[s][0]; g.beginPath();
        var pts=sh[s][1];
        for(var p=0;p<pts.length;p++){ var r=pts[p][0]*R,a=pts[p][1]; if(p) g.lineTo(r*Math.cos(a),r*Math.sin(a)); else g.moveTo(r*Math.cos(a),r*Math.sin(a)); }
        g.closePath(); g.fill();
      }
      g.restore();
    }
  }
}

/* ====== 音 ====== */
var AC=null,MG=null,NB=null,rubG=null,rubF=null,rubO=null,rubOG=null;
function audioInit(){
  if(AC){ if(AC.state!=='running'){ try{AC.resume();}catch(e){} } return; }
  var A=window.AudioContext||window.webkitAudioContext; if(!A) return;
  try{
    AC=new A(); MG=AC.createGain(); MG.gain.value=0.55;
    var comp=AC.createDynamicsCompressor(); MG.connect(comp); comp.connect(AC.destination);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); var c=NB.getChannelData(0); for(var i=0;i<c.length;i++) c[i]=Math.random()*2-1;
    var src=AC.createBufferSource(); src.buffer=NB; src.loop=true;
    rubF=AC.createBiquadFilter(); rubF.type='lowpass'; rubF.frequency.value=240;
    rubG=AC.createGain(); rubG.gain.value=0; src.connect(rubF); rubF.connect(rubG); rubG.connect(MG); src.start();
    rubO=AC.createOscillator(); rubO.type='sine'; rubO.frequency.value=170;
    rubOG=AC.createGain(); rubOG.gain.value=0; rubO.connect(rubOG); rubOG.connect(MG); rubO.start();
    if(AC.state!=='running'){ var pr=AC.resume(); if(pr&&pr.catch) pr.catch(function(){}); }
  }catch(e){ AC=null; }
}
function tone(f,dur,type,vol,f2,delay,att){
  if(!AC) return;
  try{
    var t=AC.currentTime+(delay||0), o=AC.createOscillator(), g=AC.createGain(), a=att||0.008;
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dur);
    o.connect(g); g.connect(MG); o.start(t); o.stop(t+a+dur+0.05);
  }catch(e){}
}
function noise(dur,freq,vol,type,q,f2,delay,att){
  if(!AC) return;
  try{
    var t=AC.currentTime+(delay||0), s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(), a=att||0.005;
    s.buffer=NB; f.type=type||'lowpass'; f.frequency.setValueAtTime(freq,t); if(f2) f.frequency.exponentialRampToValueAtTime(f2,t+dur); f.Q.value=q||1;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+a); g.gain.exponentialRampToValueAtTime(0.0001,t+a+dur);
    s.connect(f); f.connect(g); g.connect(MG); s.start(t,Math.random()*0.5,a+dur+0.05);
  }catch(e){}
}
function bellSnd(f,sus,vol){
  var pr=[1,2.01,2.76,4.12], pv=[1,0.45,0.3,0.16], pd=[1,0.6,0.4,0.22];
  for(var i=0;i<4;i++) tone(f*pr[i],sus*pd[i],'sine',vol*pv[i],null,0,0.004);
}
var PENTA=[0,2,4,7,9,12,14,16,19];
var sfx={
  press:function(hv){ tone(200+hv*28,0.16,'sine',0.22,(200+hv*28)*0.72); noise(0.08,320,0.12); },
  release:function(hv){ tone(260+hv*30,0.12,'triangle',0.08,420+hv*40); },
  bounce:function(p){ tone(300*p+120,0.1,'triangle',0.13,520*p+180); },
  knock:function(){ tone(190,0.08,'triangle',0.08,150); },
  success:function(){ var n=[523,659,784,1047]; for(var i=0;i<4;i++) tone(n[i],0.28,'triangle',0.12,null,i*0.08); },
  bench:function(){ noise(0.05,1300,0.16,'bandpass',3); tone(330,0.1,'square',0.04,null,0.02); sfx.success(); },
  slide:function(){ noise(0.6,600,0.06,'bandpass',2,1600); },
  tap:function(i){ noise(0.04,1900,0.13,'bandpass',4,null,i*0.22); tone(720,0.05,'triangle',0.05,null,i*0.22); },
  stool:function(){ for(var i=0;i<3;i++) sfx.tap(i); var n=[587,740,880]; for(var k=0;k<3;k++) tone(n[k],0.22,'triangle',0.11,null,0.7+k*0.09); },
  stoolUse:function(){ tone(392,0.14,'square',0.05); var n=[784,988,1175]; for(var k=0;k<3;k++) tone(n[k],0.2,'sine',0.12,null,0.05+k*0.07); },
  hop:function(){ tone(260,0.09,'sine',0.1,420); },
  land:function(p){ noise(0.07,380,0.12*p+0.05); tone(130,0.09,'sine',0.12*p+0.04,90); },
  squish:function(){ tone(150,0.16,'sine',0.14,260); noise(0.1,500,0.05); },
  wave:function(){ noise(0.7,200,0.13,'lowpass',1,1300); tone(160,0.45,'sine',0.17,380); },
  roll:function(){ tone(95,2.6,'sine',0.26,55,0,0.4); tone(143,2.4,'triangle',0.06,80,0.2,0.4); noise(2.6,170,0.12,'lowpass',1,90,0,0.5); },
  thud:function(){ tone(70,0.4,'sine',0.25,45); noise(0.3,240,0.14); },
  hammer:function(){ noise(0.04,2600,0.12,'bandpass',5); tone(880,0.05,'square',0.03); },
  sneeze:function(){ noise(0.25,900,0.035,'bandpass',1,1500,0,0.25); noise(0.18,2200,0.11,'bandpass',1.5,3200,0.3); },
  catchS:function(){ tone(330,0.12,'sine',0.17,210); var n=[1047,1319,1568]; for(var k=0;k<3;k++) tone(n[k],0.25,'sine',0.08,null,0.1+k*0.07); },
  plop:function(){ tone(240,0.12,'sine',0.12,170); },
  open:function(){ noise(0.12,900,0.08,'bandpass',2,400); tone(440,0.18,'triangle',0.07,660); },
  finale:function(){ var n=[392,494,587,784,988]; for(var k=0;k<5;k++) tone(n[k],3.5,'sine',0.06,null,k*0.35,1.0); },
  effort:function(){ tone(120,0.12,'sine',0.06,100); },
  gata:function(){ noise(0.05,500,0.06); tone(170,0.05,'triangle',0.04); },
  fluff:function(){ noise(1.2,300,0.07,'lowpass',1,900,0,0.4); }
};
function bellRing(crestH,sp,big){
  var rel=sp/vWalk, idx=clamp(Math.round(crestH*1.15+(big?2:0)),0,PENTA.length-1);
  var f=392*Math.pow(2,PENTA[idx]/12), sus=0.9+2.4*clamp((rel-1.2)/1.6,0,1);
  bellSnd(f,sus,0.2+0.08*clamp(rel-1.2,0,1.5));
  bellAV+=(big?3.2:2.0)*clamp(rel/1.6,0.6,1.8)*(D.dir||1);
  var a=bellPos(); flakeBurst(a[0],a[1]+ch*0.3,big?7:4);
  if(big){ sfx.success(); }
}

/* ====== パーティクル（大きな布片のみ、上限あり） ====== */
var FL=[], FLMAX=24, FCOLS=[COL.red,COL.gold,COL.teal,COL.wht];
function flakeBurst(x,y,n){
  for(var i=0;i<n;i++){
    if(FL.length>=FLMAX) FL.shift();
    var a=rnd(-PI*0.95,-PI*0.05), sp=rnd(0.6,1.4)*ch*3;
    FL.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:rnd(0,TAU),vr:rnd(-5,5),s:rnd(0.09,0.15)*ch,c:FCOLS[(Math.random()*4)|0],life:rnd(1.1,1.7)});
  }
}
function flakesUpd(dt){
  for(var i=FL.length-1;i>=0;i--){
    var f=FL[i]; f.vy+=ch*5*dt; f.vx*=Math.exp(-dt*1.5); f.x+=f.vx*dt; f.y+=f.vy*dt; f.r+=f.vr*dt; f.life-=dt;
    if(f.life<=0) FL.splice(i,1);
  }
}

/* ====== 工具箱・ベンチ・踏み台 ====== */
var knownV=[], benches=[], bid=0, stools=[], rollArmed=false, BOXES=5;
function boxesInUse(){ var n=0; for(var i=0;i<benches.length;i++) if(benches[i].box) n++; return n+stools.length; }
function pileCount(){ return Math.max(0,BOXES-boxesInUse()); }
function pileU(){ return cw*1.0; }
function benchFloorV(b){ var mn=99; for(var j=b.cL;j<=b.cR;j++) mn=Math.min(mn,disp[j]); return mn*hu; }
function benchCU(b){ return (b.cL+b.cR+1)/2*cw; }
function seatsFor(w){ return clamp(Math.floor(w/2.2),1,4); }
function benchW(b){ return b.cR-b.cL+1; }
function seatScr(b,k){
  var w=benchW(b), n=Math.max(b.seats,1), u=(b.cL+(k+0.5)*w/n)*cw;
  return roadToScr(u,benchFloorV(b)+ch*0.2);
}
function benchBoxScr(b){ return roadToScr(benchCU(b),benchFloorV(b)+ch*0.1); }
function createBench(v){
  var b={id:++bid,cL:v.s,cR:v.e,st:'slide',t:0,box:true,seats:seatsFor(v.w),sitters:[],nearRub:0,stoolDone:false,build:-1,side:1,lost:0,w0:v.w,u:pileU(),door:0,wRet:v.w};
  benches.push(b); sfx.slide();
  var known=false; for(var i=0;i<knownV.length;i++){ if(knownV[i][0]<=v.e+1&&knownV[i][1]>=v.s-1) known=true; }
  if(!known) rollArmed=true;
  return b;
}
function closeBench(b){
  b.st='back'; b.t=0; b.fromU=benchCU(b);
  for(var i=0;i<b.sitters.length;i++){ var a=ART[b.sitters[i]]; sendHome(a); }
  b.sitters=[];
}
function benchesUpd(dt){
